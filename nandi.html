<!DOCTYPE html>
<html>
<head>
<style>
  /* This class will center everything inside it */
  .center-container {
    text-align: center;
    width: 100%;
    margin: 0 auto; /* Centers the container itself */
  }

  /* This makes sure images don't overflow on smaller screens */
  .center-container img {
    max-width: 100%;
    height: auto;
  }

  /* Adds a little space between the elements */
  .center-container img, 
  .center-container iframe {
    margin-bottom: 20px;
  }
</style>
</head>
<body>

  <!-- Everything inside this div will be centered -->
  <div class="center-container">
    
    <img src="nandi poster1.jpg" width="800" height="422" alt="Nandi Poster"/>
    
    <br> <!-- Line break to put the logo on a new line -->
    
    <img src="cmdnand.png" width="500" height="77" alt="Commander Nandi"/>
    
    <br><br> <!-- Line breaks for spacing -->
    
    <iframe 
      width="560" 
      height="315" 
      src="https://www.youtube.com/embed/1ftBENs_wdY?si=xZpyYwWSGugkeeFZ" 
      title="YouTube video player" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin" 
      allowfullscreen>
    </iframe>

  </div>

</body>
</html>
