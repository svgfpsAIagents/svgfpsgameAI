    const svgDemon = document.getElementById("demon_path");

    let audioCtx = null;
    let scopeBuffer = [];
    let scopeNode = null;
    let audioInitialized = false;
    const MAX_BUFFER_SIZE = 16384;
    let lastX = 0, lastY = 0;

    function initAudio() {
        if (audioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const bufferSize = 1024;
            scopeNode = audioCtx.createScriptProcessor(bufferSize, 0, 2);
            scopeNode.onaudioprocess = function(e) {
                let left = e.outputBuffer.getChannelData(0);
                let right = e.outputBuffer.getChannelData(1);
                for (let i = 0; i < bufferSize; i++) {
                    if (scopeBuffer.length > 0) {
                        let pt = scopeBuffer.shift();
                        lastX = (pt.x / 960) - 1.0;
                        lastY = (pt.y / 540) - 1.0;
                        left[i] = lastX;
                        right[i] = lastY;
                    } else {
                        left[i] = lastX;
                        right[i] = lastY;
                    }
                }
            };
            scopeNode.connect(audioCtx.destination);
            audioInitialized = true;
        } catch(e) { console.log("Audio init error:", e); }
    }

    function resumeAudio() {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioInitialized) initAudio();
    }

        pts.push([1020, 300]);  // 463
        pts.push([1025, 315]);  // 464
        pts.push([1035, 305]);  // 465

        pts.push([960, 440]);   // 466
        pts.push([965, 455]);   // 467
        pts.push([955, 465]);   // 468
        pts.push([950, 455]);   // 469

        // ===== CHEST DEMONIC SYMBOL =====
        pts.push([940, 660]);   // 470
        pts.push([960, 640]);   // 471
        pts.push([980, 660]);   // 472
        pts.push([960, 680]);   // 473
        pts.push([940, 660]);   // 474

        // ===== BUILD PATH STRING =====
        let pathData = "";
        for (let i = 0; i < pts.length; i++) {
            let x = pts[i][0];
            let y = pts[i][1];
            if (i === 0) {
                pathData = `M ${x.toFixed(1)} ${y.toFixed(1)} `;
            } else {
                pathData += `L ${x.toFixed(1)} ${y.toFixed(1)} `;
            }
            if (audioInitialized && scopeBuffer.length < MAX_BUFFER_SIZE) {
                scopeBuffer.push({x: x, y: y});
            }
        }

        svgDemon.setAttribute('d', pathData);
        console.log("HUMANOID DEMON RENDERED: " + pts.length + " points");
    }

    // --- MAIN LOOP ---
    function render() {
        generateDemon();
        requestAnimationFrame(render);
