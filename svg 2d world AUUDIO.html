  function scopeFallback(){

  function lbClip(p, q){

    else{ if(r < lt0) return false; if(r < lt1) lt1 = r; }

    if(!scClip(x1, y1, x2, y2)) return;
    var dx = cq.x2 - cq.x1, dy = cq.y2 - cq.y1, len = Math.sqrt(dx * dx + dy * dy);
    if(len < 1.1) return;

    var kb = Math.round(cq.x2) * 2048 + Math.round(cq.y2);
    var key = ka < kb ? ka * 4194304 + kb : kb * 4194304 + ka;

    if(hit !== undefined){ if(cls < scCls[hit]) scCls[hit] = cls; return; }

    scX1[scN] = cq.x1; scY1[scN] = cq.y1; scX2[scN] = cq.x2; scY2[scN] = cq.y2;

          for(i = 0; i < scN; i++) if(scCls[i] === c) scIdx.push(i);
          if(scIdx.length === 0) continue;

            if(flip){ tmp = x1; x1 = x2; x2 = tmp; tmp = y1; y1 = y2; y2 = tmp; }

          var sz = bz + (Math.random() < 0.5 ? offset : -offset);

    for(var k = 0; k < 10; k++){
      var ang = rnd(0, TAU), dist = rnd(500, 1250);
      var wx = Math.cos(ang) * dist, wz = Math.sin(ang) * dist;
      var horiz = Math.random() < 0.5;
      if(horiz) buildings.push({ x: wx, z: wz, hx: rnd(90, 200), hz: rnd(18, 32), h: rnd(40, 70) });
      else buildings.push({ x: wx, z: wz, hx: rnd(18, 32), hz: rnd(90, 200), h: rnd(40, 70) });
    }
    for(var i = 0; i < 22; i++) placeCrystal(crystals, true);

  function placeCrystal(list, isAmmo){
    var x, z, tries = 0;

      x = rnd(-ARENA + 100, ARENA - 100);

  /* ==================================================================
     9. COLLISION
     ================================================================== */
  function collideWorld(px, pz, r){
    for(var i = 0; i < buildings.length; i++){
      var b = buildings[i];
      var cx = clamp(px, b.x - b.hx, b.x + b.hx);
      var cz = clamp(pz, b.z - b.hz, b.z + b.hz);
      var dx = px - cx, dz = pz - cz, d2 = dx*dx + dz*dz;
      if(d2 < r*r){
        var d = Math.sqrt(d2) || 0.001, push = r - d;
        px += dx / d * push; pz += dz / d * push;
      }
    }
    var L = Math.sqrt(px*px + pz*pz);
    if(L > ARENA){ px *= ARENA / L; pz *= ARENA / L; }
    return [px, pz];
  }
  function pointInBuilding(x, z, y){
    for(var i = 0; i < buildings.length; i++){
      var b = buildings[i];
      if(x >= b.x - b.hx && x <= b.x + b.hx && z >= b.z - b.hz && z <= b.z + b.hz && (y === undefined || y <= b.h)) return true;
    }
    return false;
  }
  function rayBoxHit(o, d, b){
    var x0 = b.x - b.hx, x1 = b.x + b.hx, z0 = b.z - b.hz, z1 = b.z + b.hz, y0 = 0, y1 = b.h;
    var tN = -1e9, tF = 1e9, t1, t2, tmp;
    if(Math.abs(d.x) > 1e-9){
      t1 = (x0 - o.x) / d.x; t2 = (x1 - o.x) / d.x;
      if(t1 > t2){ tmp = t1; t1 = t2; t2 = tmp; }
      tN = Math.max(tN, t1); tF = Math.min(tF, t2);
    } else if(o.x < x0 || o.x > x1) return -1;
    if(Math.abs(d.y) > 1e-9){
      t1 = (y0 - o.y) / d.y; t2 = (y1 - o.y) / d.y;
      if(t1 > t2){ tmp = t1; t1 = t2; t2 = tmp; }
      tN = Math.max(tN, t1); tF = Math.min(tF, t2);
    } else if(o.y < y0 || o.y > y1) return -1;
    if(Math.abs(d.z) > 1e-9){
      t1 = (z0 - o.z) / d.z; t2 = (z1 - o.z) / d.z;
      if(t1 > t2){ tmp = t1; t1 = t2; t2 = tmp; }
      tN = Math.max(tN, t1); tF = Math.min(tF, t2);
    } else if(o.z < z0 || o.z > z1) return -1;
    if(tN > tF || tF < 0) return -1;
    return tN > 0 ? tN : tF;
  }
  function raySphere(o, d, cx, cy, cz, r){
    var ox = o.x - cx, oy = o.y - cy, oz = o.z - cz;
    var b = 2 * (ox*d.x + oy*d.y + oz*d.z);
    var c = ox*ox + oy*oy + oz*oz - r*r;
    var disc = b*b - 4*c;
    if(disc < 0) return -1;
    var t = (-b - Math.sqrt(disc)) * 0.5;
    return t > 0 ? t : -1;
  }

  /* ==================================================================
     10. CAMERA
     ================================================================== */
  function camForward(){
    var cp = Math.cos(cam.pitch);
    return { x: Math.sin(cam.yaw)*cp, y: Math.sin(cam.pitch), z: Math.cos(cam.yaw)*cp };
  }
  function camPt(wx, wy, wz, o){
    var dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
    var vx = dx*cyw - dz*syw, vz = dx*syw + dz*cyw;
    o.x = vx; o.y = dy*cpw - vz*spw; o.z = dy*spw + vz*cpw;
    return o.z >= NEAR;
  }
  function projStr(o){
    return (o.x * FOCAL / o.z * HALF + HALF).toFixed(1) + "," + (-o.y * FOCAL / o.z * VS + MID).toFixed(1);
  }
  var aimPos = { x:0, y:0, z:0 };
  function worldScreen(wx, wy, wz){
    if(!camPt(wx, wy, wz, aimPos)) return null;
    if(aimPos.z > FAR) return null;
    aimPos.sx = aimPos.x * FOCAL / aimPos.z * HALF + HALF;
    aimPos.sy = -aimPos.y * FOCAL / aimPos.z * VS + MID;
    aimPos.d = aimPos.z;
    return aimPos;
  }
  var TA = { sx:0, sy:0, d:0 }, TB = { sx:0, sy:0, d:0 };
  var TC = { sx:0, sy:0, d:0 }, TD = { sx:0, sy:0, d:0 };
  function wsTo(wx, wy, wz, o){
    if(!camPt(wx, wy, wz, aimPos)) return false;
    if(aimPos.z > FAR) return false;
    o.sx = aimPos.x * FOCAL / aimPos.z * HALF + HALF;
    o.sy = -aimPos.y * FOCAL / aimPos.z * VS + MID;
    o.d = aimPos.z;
    return true;
  }
  function updateCamera(dt){
    aimBlend += (((aimDown || tAim || padAim) ? 1 : 0) - aimBlend) * Math.min(1, dt * 10);
    var dist = cam.distBase * (1 - aimBlend * 0.30);
    var side = aimBlend * 16;
    var f = camForward();
    var rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw);
    var tx = player.x - f.x * dist + rx * side;
    var ty = 58 - f.y * dist + player.jumpY * 0.4;
    var tz = player.z - f.z * dist + rz * side;
    var o = { x: player.x, y: 58 + player.jumpY * 0.4, z: player.z };
    var d = { x: tx - o.x, y: ty - o.y, z: tz - o.z };
    var dl = Math.sqrt(d.x*d.x + d.y*d.y + d.z*d.z) || 1;
    d.x /= dl; d.y /= dl; d.z /= dl;
    var t = dl;
    for(var i = 0; i < buildings.length; i++){
      var h = rayBoxHit(o, d, buildings[i]);
      if(h > 0 && h < t) t = Math.max(10, h - 8);
    }
    tx = o.x + d.x * t; ty = o.y + d.y * t; tz = o.z + d.z * t;
    if(ty < 5) ty = 5;
    var k = 1 - Math.exp(-10 * dt);
    cam.x += (tx - cam.x) * k; cam.y += (ty - cam.y) * k; cam.z += (tz - cam.z) * k;
    var eyw = cam.yaw + shakeX, epi = clamp(cam.pitch + shakeY, -1.05, 0.45);
    cyw = Math.cos(eyw); syw = Math.sin(eyw);
    cpw = Math.cos(epi); spw = Math.sin(epi);
    horY = MID + Math.tan(epi) * FOCAL * HALF;
    horEl.setAttribute("cy", clamp(horY, -400, SH + 400).toFixed(1));
  }

  /* ==================================================================
     11. FACE PIPELINE
     ================================================================== */
  var drawList = [];
  var wv8 = [];
  for(i0 = 0; i0 < 8; i0++) wv8.push({ x:0, y:0, z:0 });
  var camScr = [];
  for(i0 = 0; i0 < 10; i0++) camScr.push({ x:0, y:0, z:0 });
  var scratchV = [];
  for(i0 = 0; i0 < 80; i0++) scratchV.push({ x:0, y:0, z:0 });
  var tmpN = { x:0, y:0, z:0 };
  var FIDX = [[2,3,7,6],[0,1,5,4],[1,3,7,5],[0,2,6,4],[4,5,7,6],[0,1,3,2]];
  var FN = [[0,0,1],[0,0,-1],[1,0,0],[-1,0,0],[0,1,0],[0,-1,0]];

  function processFace(wv, idx, nx, ny, nz, stroke, swBase, fo){
    var rx = nx*cyw - nz*syw, rz = nx*syw + nz*cyw;
    var ry = ny*cpw - rz*spw, rz2 = ny*spw + rz*cpw;
    if(rz2 > 0.02) return;
    var dsum = 0, k;
    for(k = 0; k < idx.length; k++){
      var p = wv[idx[k]];
      var dx = p.x - cam.x, dy = p.y - cam.y, dz = p.z - cam.z;
      var vx = dx*cyw - dz*syw, vz = dx*syw + dz*cyw;
      var vy = dy*cpw - vz*spw, vz2 = dy*spw + vz*cpw;
      if(vz2 < NEAR) return;
      var cv = camScr[k]; cv.x = vx; cv.y = vy; cv.z = vz2;
      dsum += vz2;
    }
    var d = dsum / idx.length;
    if(d > FAR) return;
    var pts = "", vis = false, xy = [], n2 = 0;
    for(k = 0; k < idx.length; k++){
      var cv2 = camScr[k];
      var sx = cv2.x * FOCAL / cv2.z * HALF + HALF;
      var sy = -cv2.y * FOCAL / cv2.z * VS + MID;
      if(sx > -400 && sx < SW + 400 && sy > -400 && sy < SH + 400) vis = true;
      pts += (k ? " " : "") + sx.toFixed(1) + "," + sy.toFixed(1);
      xy.push(sx, sy);
      n2 += 2;
    }
    if(!vis) return;
    drawList.push({
      xy: xy, n: n2, p: pts, d: d, c: scCur, s: stroke,
      w: clamp(swBase * 170 / d, 0.45, 3.4),
      o: clamp(1.55 - d / FAR * 1.35, 0.12, 1),
      fo: fo === undefined ? 0.9 : fo
    });
  }
  function pushBox(m, cx, cy, cz, hx, hy, hz, stroke, swBase, fo){
    var n = 0;
    for(var yi = 0; yi < 2; yi++) for(var zi = 0; zi < 2; zi++) for(var xi = 0; xi < 2; xi++)
      xfTo(m, cx + (xi ? hx : -hx), cy + (yi ? hy : -hy), cz + (zi ? hz : -hz), wv8[n++]);
    for(var f = 0; f < 6; f++){
      xfN(m, FN[f][0], FN[f][1], FN[f][2], tmpN);
      processFace(wv8, FIDX[f], tmpN.x, tmpN.y, tmpN.z, stroke, swBase, fo);
    }
  }
  function flushDraw(){
    drawList.sort(function(a, b){ return b.d - a.d; });
    var n = Math.min(drawList.length, MAX_POLY), i, k;
    for(i = 0; i < n; i++){
      var f = drawList[i], p = polyEls[i];
      p.setAttribute("points", f.p);
      p.setAttribute("stroke", f.s);
      p.setAttribute("stroke-width", f.w.toFixed(2));
      p.setAttribute("stroke-opacity", f.o.toFixed(2));
      p.setAttribute("fill-opacity", f.fo.toFixed(2));
      p.removeAttribute("display");
    }
    for(i = n; i < MAX_POLY; i++) polyEls[i].setAttribute("display", "none");
    if(oscReady && oscOn && started){
      for(i = 0; i < drawList.length; i++){
        var f2 = drawList[i], xy = f2.xy, fc = f2.c;
        for(k = 0; k < f2.n; k += 2){
          var nx2 = (k + 2) % f2.n;
          scEdge(fc, xy[k], xy[k+1], xy[nx2], xy[nx2+1]);
        }
      }
    }
  }

  /* ==================================================================
     12. GEOMETRY LIBRARY
     ================================================================== */
  function makeOcta(size){
    var v = [
      { x:0, y:size, z:0 }, { x:0, y:-size, z:0 },
      { x:size, y:0, z:0 }, { x:-size, y:0, z:0 },
      { x:0, y:0, z:size }, { x:0, y:0, z:-size }
    ];
    var tris = [[0,4,2],[0,2,5],[0,5,3],[0,3,4],[1,2,4],[1,5,2],[1,3,5],[1,4,3]];
    var f = [];
    for(var i = 0; i < tris.length; i++){
      var a = { x:v[tris[i][1]].x - v[tris[i][0]].x, y:v[tris[i][1]].y - v[tris[i][0]].y, z:v[tris[i][1]].z - v[tris[i][0]].z };
      var b = { x:v[tris[i][2]].x - v[tris[i][0]].x, y:v[tris[i][2]].y - v[tris[i][0]].y, z:v[tris[i][2]].z - v[tris[i][0]].z };
      var n = { x:a.y*b.z - a.z*b.y, y:a.z*b.x - a.x*b.z, z:a.x*b.y - a.y*b.x };
      var l = Math.sqrt(n.x*n.x + n.y*n.y + n.z*n.z) || 1;
      f.push({ i: tris[i], n: { x:n.x/l, y:n.y/l, z:n.z/l } });
    }
    return { v:v, f:f };
  }
  var OCTA = makeOcta(1);
  function pushOcta(m, s, stroke, sw, fo){
    var i;
    for(i = 0; i < 6; i++){
      var v = OCTA.v[i];
      xfTo(m, v.x*s, v.y*s, v.z*s, scratchV[i]);
    }
    for(i = 0; i < 8; i++){
      var n = OCTA.f[i].n;
      xfN(m, n.x, n.y, n.z, tmpN);
      processFace(scratchV, OCTA.f[i].i, tmpN.x, tmpN.y, tmpN.z, stroke, sw, fo);
    }
  }

  /* ==================================================================
     12b. QUAD SPIDER RIG (RED GEOMETRIC VECTOR)
     ================================================================== */
  var SPIDER_S = 1.0;
  var SPIDER_BODY_H = 42;

  function buildSpider(pose){
    var S = SPIDER_S;
    var ph = pose.walkPhase;
    var att = pose.attackPhase || 0;
    var bob = Math.sin(ph) * 1.2;

    var gA = Math.sin(ph);
    var gB = Math.sin(ph + PI);
    var legLiftA = Math.max(0, gA) * 0.55 + 0.12;
    var legLiftB = Math.max(0, gB) * 0.55 + 0.12;
    var legReachA = gA * 0.25;
    var legReachB = gB * 0.25;

    var Mroot = mul(TR(pose.x, 0, pose.z), RY(pose.facing));
    var bodyY = SPIDER_BODY_H + bob;

    var Mceph = mul(Mroot, TR(20 * S, bodyY, 0));
    pushBox(Mceph, 0, -8 * S, 0, 22 * S, 4 * S, 26 * S, SPIDER_BODY_DARK, 1.4, 0.92);
    pushBox(Mceph, 0,  4 * S, 0, 26 * S, 8 * S, 30 * S, SPIDER_BODY_MID, 1.6, 0.92);
    pushBox(Mceph, 0, 12 * S, 0, 20 * S, 2 * S, 24 * S, SPIDER_SEG_MID, 1.4, 0.92);
    pushBox(Mceph, 0, -2 * S, 26 * S, 10 * S, 5 * S, 5 * S, SPIDER_SEG_DARK, 1.2, 0.92);

    var Mabdo = mul(Mroot, TR(-32 * S, bodyY, 0));
    pushBox(Mabdo, 0, -8 * S, 0, 26 * S, 4 * S, 30 * S, SPIDER_BODY_DARK, 1.4, 0.92);
    pushBox(Mabdo, 0,  4 * S, 0, 30 * S, 10 * S, 34 * S, SPIDER_BODY_MID, 1.6, 0.92);
    pushBox(Mabdo, 0, 14 * S, 0, 24 * S, 2 * S, 26 * S, SPIDER_SEG_MID, 1.4, 0.92);
    pushBox(Mabdo, -8 * S, 10 * S, 12 * S, 3 * S, 1.2 * S, 14 * S, SPIDER_SEG_DARK, 1.0, 0.92);
    pushBox(Mabdo,  8 * S, 10 * S, 12 * S, 3 * S, 1.2 * S, 14 * S, SPIDER_SEG_DARK, 1.0, 0.92);

    scCur = SC_ENEMY;
    var Mex = mul(Mroot, TR(44 * S, bodyY + 4 * S, 0));
    pushBox(Mex, -6 * S,  4 * S, 0, 1.6 * S, 1.6 * S, 1.6 * S, SPIDER_EYE, 1.2, 1);
    pushBox(Mex,  6 * S,  4 * S, 0, 1.6 * S, 1.6 * S, 1.6 * S, SPIDER_EYE, 1.2, 1);
    pushBox(Mex, -3 * S,  7 * S, 0, 1.2 * S, 1.2 * S, 1.2 * S, SPIDER_EYE, 1.1, 1);
    pushBox(Mex,  3 * S,  7 * S, 0, 1.2 * S, 1.2 * S, 1.2 * S, SPIDER_EYE, 1.1, 1);
    pushBox(Mex, -1.5 * S, 1.5 * S, 0, 0.9 * S, 0.9 * S, 0.9 * S, SPIDER_EYE, 1.0, 1);
    pushBox(Mex,  1.5 * S, 1.5 * S, 0, 0.9 * S, 0.9 * S, 0.9 * S, SPIDER_EYE, 1.0, 1);
    pushBox(Mex, -4 * S, 0, 0, 0.7 * S, 0.7 * S, 0.7 * S, SPIDER_EYE, 0.9, 1);
    pushBox(Mex,  4 * S, 0, 0, 0.7 * S, 0.7 * S, 0.7 * S, SPIDER_EYE, 0.9, 1);

    var Mfang = mul(Mroot, TR(48 * S, bodyY - 4 * S, 0));
    pushBox(Mfang, -5 * S, 0, 0, 2.4 * S, 3 * S, 2.4 * S, SPIDER_SEG_DARK, 1.1, 0.92);
    pushBox(Mfang,  5 * S, 0, 0, 2.4 * S, 3 * S, 2.4 * S, SPIDER_SEG_DARK, 1.1, 0.92);
    pushBox(Mfang, -5 * S, -4 * S, 0, 1.4 * S, 1.4 * S, 1.4 * S, SPIDER_SEG_EDGE, 1.1, 0.92);
    pushBox(Mfang,  5 * S, -4 * S, 0, 1.4 * S, 1.4 * S, 1.4 * S, SPIDER_SEG_EDGE, 1.1, 0.92);

    var Mped = mul(Mroot, TR(50 * S, bodyY + 2 * S, 0));
    pushBox(Mped, -8 * S, 0, 0, 2 * S, 2 * S, 4 * S, SPIDER_SEG_MID, 1.0, 0.92);
    pushBox(Mped,  8 * S, 0, 0, 2 * S, 2 * S, 4 * S, SPIDER_SEG_MID, 1.0, 0.92);

    buildSpiderLeg(Mroot, bodyY, +1, -1, legLiftA, legReachA, S, "FL");
    buildSpiderLeg(Mroot, bodyY, -1, -1, legLiftB, legReachB, S, "FR");
    buildSpiderLeg(Mroot, bodyY, +1, +1, legLiftB, legReachB, S, "RL");
    buildSpiderLeg(Mroot, bodyY, -1, +1, legLiftA, legReachA, S, "RR");
  }

  function buildSpiderLeg(Mroot, bodyY, sideX, sideZ, lift, reach, S, tag){
    var anchorX = (sideZ < 0 ? 26 : -22) * S;
    var anchorZ = sideX * (sideZ < 0 ? 26 : 34) * S;
    var Manchor = mul(Mroot, TR(anchorX, bodyY - 4 * S, anchorZ));

    pushBox(Manchor, 0, 0, 0, 4 * S, 5 * S, 4 * S, SPIDER_SEG_DARK, 1.3, 0.92);

    var Mfem = mul(Manchor, TR(sideZ * 6 * S, 0, sideX * 6 * S));
    Mfem = mul(Mfem, RY(sideX * sideZ * 0.6));
    pushBox(Mfem, 0, 0, 0, 16 * S, 5 * S, 5 * S, SPIDER_SEG_MID, 1.6, 0.92);
    pushBox(Mfem, 0, 4 * S, 0, 14 * S, 1 * S, 3 * S, SPIDER_SEG_HI, 1.2, 0.92);

    var Mtib = mul(Mfem, TR(sideZ * 24 * S, -6 * S - lift * 4 * S, sideX * 8 * S));
    Mtib = mul(Mtib, RY(sideX * sideZ * 0.9));
    Mtib = mul(Mtib, RX(sideZ * -0.5));
    pushBox(Mtib, 0, 0, 0, 14 * S, 4 * S, 4 * S, SPIDER_SEG_LIGHT, 1.5, 0.92);
    pushBox(Mtib, 0, 3 * S, 0, 12 * S, 1 * S, 2.6 * S, SPIDER_SEG_HI, 1.1, 0.92);

    var Mtars = mul(Mtib, TR(sideZ * 22 * S, -12 * S - lift * 10 * S + reach * 4 * S, sideX * 4 * S));
    Mtars = mul(Mtars, RX(sideZ * -0.8));
    pushBox(Mtars, 0, 0, 0, 10 * S, 3 * S, 3 * S, SPIDER_SEG_HI, 1.3, 0.92);

    var Mclaw = mul(Mtars, TR(sideZ * 14 * S, -6 * S, 0));
    pushBox(Mclaw, 0, 0, 0, 5 * S, 2 * S, 2 * S, SPIDER_SEG_EDGE, 1.2, 0.92);
    pushBox(Mclaw, sideZ * 3 * S, 0, 0, 2.5 * S, 1.2 * S, 1.2 * S, SPIDER_SEG_EDGE, 1.1, 0.92);
  }

  /* ==================================================================
     13. FLOOR / SHADOW / RINGS / MOTES
     ================================================================== */
  var HSIZE = 78, COLST = HSIZE * 1.5, ROWST = HSIZE * 1.7320508;
  function renderFloor(t){
    var q0 = Math.round(player.x / COLST), r0 = Math.round(player.z / ROWST), list = [];
    for(var q = q0 - 12; q <= q0 + 12; q++) for(var r = r0 - 12; r <= r0 + 12; r++){
      var hx = q * COLST, hz = r * ROWST + ((q & 1) ? ROWST * 0.5 : 0);
      var dx = hx - cam.x, dz = hz - cam.z, d = Math.sqrt(dx*dx + dz*dz);
      if(d > FAR * 0.92) continue;
      var pts = "", ok = true, vis = false, v;
      for(v = 0; v < 6; v++){
        var ang = PI / 3 * v;
        if(!camPt(hx + Math.cos(ang)*HSIZE, 0, hz + Math.sin(ang)*HSIZE, tmpP)){ ok = false; break; }
        var s = projStr(tmpP).split(",");
        var sx = +s[0], sy = +s[1];
        if(sx > -100 && sx < SW + 100 && sy > -100 && sy < SH + 100) vis = true;
        pts += (v ? " " : "") + s[0] + "," + s[1];
      }
      if(!ok || !vis) continue;
      var a = 1 - d / (FAR * 0.92);

  function buildM88(pose, opts, jumpY){
    var g = pose.gait;
    var ph = pose.phase;
    var S = opts.scale || 1.0;
    var jy = jumpY || 0;
    var sL = Math.sin(ph), cL = Math.cos(ph);
    var sR = -sL;
    var swingL = Math.max(0, cL), swingR = Math.max(0, -cL);
    var breathe = Math.sin(performance.now() * 0.0018) * 0.6;
    var drop = (0.5 - 0.5 * Math.cos(2 * ph)) * g.drop;
    var bodyY = 51.5 * S - drop + (g.freq < 1 ? breathe : 0);
    var ab = pose.aimBlend || 0;
    if(pose.downed) bodyY *= 0.55;

    var thighL = sL * g.thigh;
    var thighR = sR * g.thigh;
    var kneeL = g.kneeB + swingL * g.knee;
    var kneeR = g.kneeB + swingR * g.knee;

    var armL0 = sR * g.arm + 0.06 + breathe * 0.025;
    var armR0 = 0.34 + sL * g.arm * 0.25;
    var armL = armL0 * (1 - ab) + 1.10 * ab;
    var armR = armR0 * (1 - ab) + 1.32 * ab;
    var elbowL = 0.35 + Math.max(0, sR) * g.elbow;
    var elbowR = (0.85 + Math.max(0, sL) * g.elbow * 0.3) * (1 - ab) + 0.22 * ab;
    var lean = g.lean * (1 - ab) + 0.03 * ab + breathe * 0.008;
    var twist = sL * g.twist * (1 - ab * 0.7);
    var nod = -lean * 0.8 - ab * 0.1 + Math.sin(performance.now() * 0.0009) * 0.02;
    var headYaw = (g.freq < 1 ? Math.sin(performance.now() * 0.0005) * 0.12 : sL * 0.03) * (1 - ab);
    var ankleL = (thighL - kneeL) * 0.85;
    var ankleR = (thighR - kneeR) * 0.85;

    var C = opts.colors;
    var P = C.primary, H = C.hi, D = C.dark;
    var Hel = C.helmet, HelHi = C.helmetHi, Vis = C.visor;
    var Rifle = C.rifle, RifleHi = C.rifleHi, Emit = C.emitter;
    var Glove = C.glove, Boot = C.boot;

    var Mroot = mul(TR(pose.x, jy, pose.z), RY(pose.facing));
    var Mpelvis = mul(Mroot, TR(0, bodyY, 0));
    var Mupper = mul(Mpelvis, TR(0, 4 * S, 0));
    Mupper = mul(Mupper, RY(twist));
    Mupper = mul(Mupper, RX(lean));
    if(pose.downed) Mupper = mul(Mupper, RX(0.5));

    pushBox(Mpelvis, 0, -1 * S, 0, 9.5 * S, 6 * S, 7 * S, D, 1.15);
    pushBox(Mpelvis, 0, 4.5 * S, 0, 11.5 * S, 3 * S, 7.5 * S, P, 1.1);
    pushBox(Mpelvis, 0, 4.5 * S, 8.2 * S, 2.5 * S, 2 * S, 1.2 * S, H, 0.9);

    pushBox(Mupper, 0, 22 * S, 0, 11 * S, 13 * S, 7 * S, D, 1.25);
    pushBox(Mupper, 0, 20 * S, 0.5 * S, 12.5 * S, 12 * S, 8.5 * S, P, 1.3);
    pushBox(Mupper, -6 * S, 13.5 * S, 10 * S, 3.8 * S, 4.5 * S, 2 * S, H, 0.9);
    pushBox(Mupper, 0, 13.5 * S, 10 * S, 3.8 * S, 4.5 * S, 2 * S, H, 0.9);
    pushBox(Mupper, 6 * S, 13.5 * S, 10 * S, 3.8 * S, 4.5 * S, 2 * S, H, 0.9);
    pushBox(Mupper, -13 * S, 30 * S, 0, 4.5 * S, 4 * S, 6.5 * S, H, 1.0);
    pushBox(Mupper, 13 * S, 30 * S, 0, 4.5 * S, 4 * S, 6.5 * S, H, 1.0);

    var Mh = mul(Mupper, TR(0, 39 * S, 0));
    Mh = mul(Mh, RY(headYaw));
    Mh = mul(Mh, RX(nod));
    pushBox(Mh, 0, -6 * S, 0, 4 * S, 4 * S, 4 * S, D, 0.85);
    pushBox(Mh, 0, 6 * S, 0.5 * S, 5.5 * S, 5 * S, 6 * S, Hel, 1.15);
    pushBox(Mh, 0, 11 * S, -0.5 * S, 6 * S, 2 * S, 6 * S, HelHi, 1.05);
    pushBox(Mh, 0, 3.5 * S, 6 * S, 5.8 * S, 1.2 * S, 0.6 * S, HelHi, 1.0);
    pushBox(Mh, 0, 9 * S, 6.2 * S, 2.2 * S, 2.4 * S, 0.9 * S, D, 0.85);
    pushBox(Mh, 0, 9 * S, 7.4 * S, 1.4 * S, 1.4 * S, 1.2 * S, Vis, 1.0);
    pushBox(Mh, 0, 4.5 * S, 3.5 * S, 6.2 * S, 1.6 * S, 2 * S, D, 0.85);
    pushBox(Mh, 0, 4.5 * S, 5.8 * S, 4.2 * S, 1.4 * S, 0.4 * S, Vis, 1.2);

    var MsL = mul(Mupper, TR(-13 * S, 28 * S, 0)); MsL = mul(MsL, RX(-armL));
    pushBox(MsL, 0, -8 * S, 0, 3.2 * S, 8 * S, 3.2 * S, P, 1.05);
    var MeL = mul(MsL, TR(0, -16 * S, 0)); MeL = mul(MeL, RX(-elbowL));
    pushBox(MeL, 0, -7.5 * S, 0, 2.8 * S, 7.5 * S, 2.8 * S, D, 1.0);
    pushBox(MeL, 0, -17 * S, 0, 3 * S, 3 * S, 3.2 * S, Glove, 0.95);

    var MsR = mul(Mupper, TR(13 * S, 28 * S, 0)); MsR = mul(MsR, RX(-armR));
    pushBox(MsR, 0, -8 * S, 0, 3.2 * S, 8 * S, 3.2 * S, P, 1.05);
    var MeR = mul(MsR, TR(0, -16 * S, 0)); MeR = mul(MeR, RX(-elbowR));
    pushBox(MeR, 0, -7.5 * S, 0, 2.8 * S, 7.5 * S, 2.8 * S, D, 1.0);
    var MhR = mul(MeR, TR(0, -17 * S, 0));

    pushBox(MhR, 0, -2 * S, 0, 2 * S, 6.5 * S, 1.9 * S, Rifle, 1.0);
    pushBox(MhR, 0, -13.5 * S, 0.4 * S, 1 * S, 7.5 * S, 1.2 * S, Rifle, 0.9);
    pushBox(MhR, 0, -21 * S, 0.4 * S, 1.4 * S, 1.2 * S, 1.5 * S, RifleHi, 1.0);
    pushBox(MhR, 0, -21.5 * S, 0.4 * S, 0.7 * S, 0.5 * S, 0.8 * S, Emit, 1.4);
    pushBox(MhR, 0, 7.5 * S, -0.6 * S, 1.7 * S, 5 * S, 1.6 * S, RifleHi, 0.9);
    pushBox(MhR, 0, 12 * S, -0.6 * S, 1.4 * S, 4 * S, 1.5 * S, Rifle, 0.85);
    pushBox(MhR, 0, -3 * S, 3.2 * S, 1.2 * S, 3 * S, 1.2 * S, RifleHi, 0.95);
    pushBox(MhR, -2.2 * S, -4 * S, 0, 0.5 * S, 3 * S, 1.4 * S, Rifle, 0.8);
    pushBox(MhR, 0, -8 * S, -2.6 * S, 1 * S, 3 * S, 1.2 * S, Emit, 1.2);
    xfTo(MhR, 0, -23 * S, 0.4 * S, pose.muzzle);

    var MhipL = mul(Mpelvis, TR(-6.5 * S, -2 * S, 0)); MhipL = mul(MhipL, RX(-thighL));
    pushBox(MhipL, 0, -10.5 * S, 0, 4.6 * S, 10.5 * S, 4.6 * S, P, 1.15);
    pushBox(MhipL, 0, -20 * S, 2.8 * S, 4.9 * S, 4 * S, 2.2 * S, H, 0.95);
    var MknL = mul(MhipL, TR(0, -21 * S, 0)); MknL = mul(MknL, RX(kneeL));
    pushBox(MknL, 0, -11 * S, 0, 4 * S, 11 * S, 4 * S, D, 1.1);
    var MakL = mul(MknL, TR(0, -22 * S, 0)); MakL = mul(MakL, RX(ankleL));
    pushBox(MakL, 0, -3.5 * S, 2.5 * S, 4.6 * S, 3.5 * S, 7 * S, Boot, 1.15);
    xfTo(MakL, 0, -6 * S, 2 * S, pose.footL);

    var MhipR = mul(Mpelvis, TR(6.5 * S, -2 * S, 0)); MhipR = mul(MhipR, RX(-thighR));
    pushBox(MhipR, 0, -10.5 * S, 0, 4.6 * S, 10.5 * S, 4.6 * S, P, 1.15);
    pushBox(MhipR, 0, -20 * S, 2.8 * S, 4.9 * S, 4 * S, 2.2 * S, H, 0.95);
    var MknR = mul(MhipR, TR(0, -21 * S, 0)); MknR = mul(MknR, RX(kneeR));
    pushBox(MknR, 0, -11 * S, 0, 4 * S, 11 * S, 4 * S, D, 1.1);
    var MakR = mul(MknR, TR(0, -22 * S, 0)); MakR = mul(MakR, RX(ankleR));
    pushBox(MakR, 0, -3.5 * S, 2.5 * S, 4.6 * S, 3.5 * S, 7 * S, Boot, 1.15);
    xfTo(MakR, 0, -6 * S, 2 * S, pose.footR);
  }

  function updateVFX(dt){
    var i;
    for(i = tracers.length - 1; i >= 0; i--){ tracers[i].life -= dt; if(tracers[i].life <= 0) tracers.splice(i, 1); }
    for(i = muzzleF.length - 1; i >= 0; i--){ muzzleF[i].life -= dt; if(muzzleF[i].life <= 0) muzzleF.splice(i, 1); }
    for(i = explosions.length - 1; i >= 0; i--){
      explosions[i].t += dt;
      if(explosions[i].t >= explosions[i].max) explosions.splice(i, 1);
    }
    for(i = impacts.length - 1; i >= 0; i--){
      var p = impacts[i];
      p.life -= dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      p.vy -= 420 * dt;
      if(p.y < 1){ p.y = 1; p.vy *= -0.35; p.vx *= 0.7; p.vz *= 0.7; }
      if(p.life <= 0) impacts.splice(i, 1);
    }
    for(i = rings.length - 1; i >= 0; i--){ rings[i].life -= dt; if(rings[i].life <= 0) rings.splice(i, 1); }
    if(hitT > 0) hitT -= dt;
    if(dmgT > 0) dmgT -= dt;
    if(shake > 0){
      shake -= dt * 0.35;
      shakeX = (Math.random() - 0.5) * shake * 40;
      shakeY = (Math.random() - 0.5) * shake * 22;
    } else { shakeX = 0; shakeY = 0; }
  }

  /* ==================================================================
     17. SHOOTING / TARGETING
     ================================================================== */
  function castShot(o, d){
    var best = 1e9, kind = "sky", obj = null, t, i;
    for(i = 0; i < enemies.length; i++){
      t = raySphere(o, d, enemies[i].x, 52, enemies[i].z, 42);
      if(t > 0 && t < best){ best = t; kind = "enemy"; obj = enemies[i]; }
    }
    for(i = 0; i < spiders.length; i++){
      t = raySphere(o, d, spiders[i].x, SPIDER_BODY_H, spiders[i].z, 38);
      if(t > 0 && t < best){ best = t; kind = "spider"; obj = spiders[i]; }
    }
    for(i = 0; i < buildings.length; i++){
      t = rayBoxHit(o, d, buildings[i]);
      if(t > 0 && t < best){ best = t; kind = "wall"; obj = buildings[i]; }
    }
    if(d.y < -1e-4){
      t = -o.y / d.y;
      if(t > 0 && t < best){ best = t; kind = "ground"; obj = null; }
    }
    var tc = best > 2000 ? 2000 : best;
    return {
      t: best, kind: kind, obj: obj,
      x: o.x + d.x * tc, y: o.y + d.y * tc, z: o.z + d.z * tc
    };
  }
  function angErr(o, d, cx, cy, cz){
    var ox = cx - o.x, oy = cy - o.y, oz = cz - o.z;
    var l = Math.sqrt(ox*ox + oy*oy + oz*oz) || 1;
    var dot = ox/l*d.x + oy/l*d.y + oz/l*d.z;
    return { dot: dot, ang: Math.acos(clamp(dot, -1, 1)), dist: l };
  }
  function findAimAssist(o, d){
    var best = null, bestA = 0.09, i, e, c;
    for(i = 0; i < enemies.length; i++){
      e = enemies[i]; c = angErr(o, d, e.x, 52, e.z);
      if(c.ang < bestA && c.dist < 900){ bestA = c.ang; best = e; }
    }
    for(i = 0; i < spiders.length; i++){
      e = spiders[i]; c = angErr(o, d, e.x, SPIDER_BODY_H, e.z);
      if(c.ang < bestA && c.dist < 1000){ bestA = c.ang; best = e; }
    }
    return best;
  }

  /* --- LB + MOVE AIM-SHOOT: fire toward the moving mouse target --- */
  function fireAtScreenPoint(sx, sy){
    /* convert screen point to a world-space ray through the camera */
    var cp = Math.cos(cam.pitch);
    /* compute the ray direction from the camera through the screen point */
    var nx = (sx - HALF) / HALF;   /* -1..1 */
    var ny = (sy - MID) / VS;      /* -1..1 */
    /* build the forward and right vectors of the camera */
    var f = camForward();
    var rxv = Math.cos(cam.yaw), rzv = -Math.sin(cam.yaw);
    var upv = { x:-f.y*Math.sin(cam.yaw), y:cp, z:-f.y*Math.cos(cam.yaw) };
    /* direction: forward + right*nx + up*(-ny) with a focal scale */
    var d = {
      x: f.x + rxv * nx * 0.55,
      y: f.y + upv.y * (-ny) * 0.55,
      z: f.z + rzv * nx * 0.55
    };
    var dl = Math.sqrt(d.x*d.x + d.y*d.y + d.z*d.z) || 1;
    d.x /= dl; d.y /= dl; d.z /= dl;
    /* cast from a point slightly ahead of the player, along the aim ray */
    var o = { x: player.x, y: 58 + player.jumpY * 0.4, z: player.z };
    /* move origin forward so we don't hit the player's own body */
    o.x += f.x * 18; o.z += f.z * 18;
    var hit = castShot(o, d);
    var mzl = { x: player.muzzle.x, y: player.muzzle.y, z: player.muzzle.z };
    if(mzl.x === 0 && mzl.y === 0 && mzl.z === 0){
      mzl = { x: o.x + f.x * 22, y: o.y - 4, z: o.z + f.z * 22 };
    }
    muzzleFlash(mzl, PLAYER_GREEN_HI);
    addTracer(mzl, hit, PLAYER_GREEN, 0.22, 1);
    if(hit.kind === "enemy"){
      hit.obj.hp -= 34;
      hitT = 0.2; hitKill = hit.obj.hp <= 0;
      sparks(hit.x, hit.y, hit.z, 4, ENEMY_RED);
      if(hit.obj.hp <= 0) killEnemy(hit.obj);
    } else if(hit.kind === "spider"){
      var eyeHit = Math.abs(hit.x - (hit.obj.x + Math.cos(hit.obj.facing) * 44)) < 14
                && Math.abs(hit.z - (hit.obj.z - Math.sin(hit.obj.facing) * 44)) < 14
                && hit.y > SPIDER_BODY_H - 2 && hit.y < SPIDER_BODY_H + 14;
      var dmg = eyeHit ? 34 * 2.4 : 34;
      hit.obj.hp -= dmg;
      hitT = 0.22; hitKill = hit.obj.hp <= 0;
      sparks(hit.x, hit.y, hit.z, eyeHit ? 8 : 5, eyeHit ? SPIDER_EYE : SPIDER_SEG_HI);
      if(eyeHit){ showToast("EYE SHOT x2.4"); shake = Math.min(0.14, shake + 0.05); }
      if(hit.obj.hp <= 0) killSpider(hit.obj);
    } else if(hit.kind !== "sky"){
      sparks(hit.x, hit.y, hit.z, 3, hit.kind === "ground" ? FLOOR_ORANGE : BUILDING_ORANGE_HI);
    }
  }

  function playerFire(){

  /* ==================================================================
     18. UPDATES
     ================================================================== */
  function updatePlayer(dt){
    var ix = ((keys.KeyD || keys.ArrowRight) ? 1 : 0) - ((keys.KeyA || keys.ArrowLeft) ? 1 : 0);
    var iz = ((keys.KeyW || keys.ArrowUp) ? 1 : 0) - ((keys.KeyS || keys.ArrowDown) ? 1 : 0);
    if(tLf) ix -= 1;
    if(tRt) ix += 1;
    if(tUp) iz += 1;
    if(tDn) iz -= 1;
    /* gamepad left stick */
    ix += deadzone(padAxes.lx, PAD_DEADZONE);
    iz -= deadzone(padAxes.ly, PAD_DEADZONE);
    ix = clamp(ix, -1, 1); iz = clamp(iz, -1, 1);
    var mag = Math.sqrt(ix*ix + iz*iz);
    if(mag > 1){ ix /= mag; iz /= mag; mag = 1; }
    var active = animMode === "AUTO" && mag > 0.12;
    var sprintKey = keys.ShiftLeft || keys.ShiftRight;
    var sprint = active && (sprintKey || dpadSprint) && aimBlend < 0.5;
    var tgt = animMode !== "AUTO" ? animMode : (active ? (sprint ? "RUN" : "WALK") : "IDLE");
    gaitName = tgt;
    var gT = GAITS[tgt], k = 1 - Math.exp(-dt * 5), key;
    for(key in cur) cur[key] += (gT[key] - cur[key]) * k;
    if(active){
      var dirx = Math.sin(cam.yaw) * iz + Math.cos(cam.yaw) * ix;
      var dirz = Math.cos(cam.yaw) * iz - Math.sin(cam.yaw) * ix;
      var dl = Math.sqrt(dirx*dirx + dirz*dirz) || 1;
      dirx /= dl; dirz /= dl;
      lastDirX = dirx; lastDirZ = dirz;
      player.speed += (gT.speed * Math.min(1, mag * 1.15) * (sprint ? 1.15 : 1) * (aimBlend > 0.5 ? 0.5 : 1) - player.speed) * (1 - Math.exp(-9 * dt));
    } else {
      player.speed += (0 - player.speed) * (1 - Math.exp(-9 * dt));
    }
    var wantFace = (aimBlend > 0.4 || (lockTarget && lockTarget.hp > 0)) ? cam.yaw : Math.atan2(lastDirX, lastDirZ);
    /* if LB + move aim-shoot is active, face the mouse target direction */
    if(padLbAimActive && padLbAimShoot){
      var msx = mouseTargetX, msy = mouseTargetY;
      var cpf = Math.cos(cam.pitch);
      var fdx = camForward();
      var nx2 = (msx - HALF) / HALF, ny2 = (msy - MID) / VS;
      var dtx = fdx.x + Math.cos(cam.yaw) * nx2 * 0.55;
      var dtz = fdx.z - Math.sin(cam.yaw) * nx2 * 0.55;
      wantFace = Math.atan2(dtx, dtz);
    }
    var fk = active ? 11 : 3;
    player.facing = lerpAngle(player.facing, wantFace, 1 - Math.exp(-fk * dt));
    if(player.speed > 1){
      player.x += lastDirX * player.speed * dt;
      player.z += lastDirZ * player.speed * dt;
      var res = collideWorld(player.x, player.z, 13);
      player.x = res[0]; player.z = res[1];
    }
    if(player.jumping){
      player.jumpV -= 900 * dt;
      player.jumpY += player.jumpV * dt;
      if(player.jumpY <= 0){ player.jumpY = 0; player.jumpV = 0; player.jumping = false; }
    }
    var pc = Math.cos(player.phase);
    player.phase += cur.freq * dt;
    if(cur.freq > 1){
      var c = Math.cos(player.phase);
      if(pc > 0 && c <= 0) spawnRing(player.footL.x, player.footL.z, PLAYER_GREEN, 14);
      else if(pc < 0 && c >= 0) spawnRing(player.footR.x, player.footR.z, PLAYER_GREEN, 14);
    }
    player.fireCD -= dt;
    player.spread = Math.max(0, player.spread - dt * 0.05);
    player.spread = Math.min(0.05, player.spread + player.speed * 0.00008);
    if(player.reloadT > 0){
      player.reloadT -= dt;
      if(player.reloadT <= 0){
        var need = 30 - player.mag, take = Math.min(need, player.reserve);
        player.mag += take; player.reserve -= take;
      }
    }
    /* FIRE: mouse, touch, right trigger, or LB+move aim-shoot */
    var wantFire = mouseDown || tFire || padFire;
    if(padLbAimActive && padLbAimShoot && active) wantFire = true;
    if(wantFire && !ended){
      if(padLbAimActive && padLbAimShoot && active){
        /* fire at the moving mouse target screen point */
        if(player.fireCD <= 0 && player.reloadT <= 0 && player.mag > 0){
          player.mag--;
          player.fireCD = 0.14;
          player.spread = Math.min(0.05, player.spread + 0.016);
          fireAtScreenPoint(mouseTargetX, mouseTargetY);
        } else if(player.mag <= 0) startReload();
      } else {
        playerFire();
      }
    }
  }
  function updateAlly(dt){
    if(ally.downT > 0){
      ally.downT -= dt;
      if(ally.downT <= 0){ ally.hp = 40; showToast("VIPER-2 BACK ONLINE"); }
      ally.speed += (0 - ally.speed) * (1 - Math.exp(-8 * dt));
      return;
    }
    var best = null, bd = 600, i, e, dx, dz, d;
    for(i = 0; i < enemies.length; i++){
      e = enemies[i]; dx = e.x - ally.x; dz = e.z - ally.z; d = Math.sqrt(dx*dx + dz*dz);
      if(d < bd){ bd = d; best = e; }
    }
    for(i = 0; i < spiders.length; i++){
      e = spiders[i]; dx = e.x - ally.x; dz = e.z - ally.z; d = Math.sqrt(dx*dx + dz*dz);
      if(d < bd){ bd = d; best = e; }
    }
    ally.target = best;
    var mvx = 0, mvz = 0, wantSpeed = 0;
    if(best){
      dx = best.x - ally.x; dz = best.z - ally.z; d = Math.sqrt(dx*dx + dz*dz) || 1;
      ally.facing = lerpAngle(ally.facing, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
      if(d > 240){ mvx = dx / d; mvz = dz / d; wantSpeed = 150; }
      ally.fireT -= dt;
      if(ally.fireT <= 0 && ally.burst <= 0){ ally.burst = 3; ally.burstT = 0; }
      if(ally.burst > 0){
        ally.burstT -= dt;
        if(ally.burstT <= 0){
          ally.burstT = 0.13; ally.burst--;
          allyFire();
          if(ally.burst <= 0) ally.fireT = rnd(0.9, 1.5);
        }
      }
    } else {
      var fx = player.x - Math.sin(player.facing) * 34 + Math.cos(player.facing) * (-26);
      var fz = player.z - Math.cos(player.facing) * 34 - Math.sin(player.facing) * (-26);
      dx = fx - ally.x; dz = fz - ally.z; d = Math.sqrt(dx*dx + dz*dz);
      if(d > 26){
        mvx = dx / d; mvz = dz / d;
        wantSpeed = Math.min(170, d * 2.2);
        ally.facing = lerpAngle(ally.facing, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
      }
    }
    ally.speed += (wantSpeed - ally.speed) * (1 - Math.exp(-7 * dt));
    if(ally.speed > 2){
      ally.x += mvx * ally.speed * dt;
      ally.z += mvz * ally.speed * dt;
      var res = collideWorld(ally.x, ally.z, 11);
      ally.x = res[0]; ally.z = res[1];
    }
    var pc = Math.cos(ally.phase);
    ally.phase += 7 * clamp(ally.speed / 150, 0, 1.1) * dt;
    if(ally.speed > 40){
      var c = Math.cos(ally.phase);
      if(pc > 0 && c <= 0) spawnRing(ally.x, ally.z, ALLY_GREEN, 10);
    }
    ally.hp = Math.min(ally.maxHp, ally.hp + dt * 2.5);
  }
  function updateEnemies(dt){
    var theme = waveTheme(wave);
    for(var i = enemies.length - 1; i >= 0; i--){
      var r = enemies[i];
      var toX = player.x - r.x, toZ = player.z - r.z;
      var dist = Math.sqrt(toX*toX + toZ*toZ);
      if(dist < 420){ r.state = dist < 230 ? "attack" : "chase"; r.alertT = 6; }
      else if(r.alertT > 0){ r.alertT -= dt; r.state = "chase"; }
      else r.state = "patrol";

        }
      } else if(r.state === "chase"){
        if(dist > 40){
          mx = toX / dist * 62 * dt; mz = toZ / dist * 62 * dt;
          r.facing = Math.atan2(toX, toZ); r.walking = true;
        }
      } else {

        var sm = Math.sin(performance.now() * 0.002 + i * 1.7) * 40 * dt;
        mx = Math.cos(sa) * sm; mz = Math.sin(sa) * sm;
        r.walking = true;
        r.fireCD -= dt;
        if(r.fireCD <= 0 && dist < 520){
          r.fireCD = rnd(1.2, 2.4);

      }
      if(r.walking) r.walkPhase += dt * 5;

      if(r.walking && Math.sin(r.walkPhase) * Math.sin(r.walkPhase - dt * 5) < 0)

  }
  function updateSpiders(dt){

          sp.patrolZ = sp.z + rnd(-360, 360);
        } else {
          mx = pdx / pd * sp.speed * dt;
          mz = pdz / pd * sp.speed * dt;
          sp.facing = Math.atan2(pdx, pdz);
        }
      } else if(sp.state === "chase"){
        if(dist > 60){
          mx = toX / dist * (sp.speed + 40) * dt;
          mz = toZ / dist * (sp.speed + 40) * dt;
        }
        sp.facing = Math.atan2(toX, toZ);
      } else {
        sp.facing = Math.atan2(toX, toZ);
        sp.attackPhase = Math.min(1, (sp.attackPhase || 0) + dt * 2.4);
        sp.biteCD -= dt;
        if(sp.biteCD <= 0 && dist < 90){
          sp.biteCD = rnd(1.6, 2.6);
          if(dist < 80){
            player.hp -= 18;
            dmgT = 0.35;
            sparks(player.x, 40, player.z, 5, ENEMY_RED);
            if(player.hp <= 0){ player.hp = 0; gameOver(); }
          }
        }
      }
      if(sp.state !== "attack" && sp.attackPhase > 0){
        sp.attackPhase = Math.max(0, sp.attackPhase - dt * 2.0);
      }

      if(mx !== 0 || mz !== 0){
        var res = collideWorld(sp.x + mx, sp.z + mz, 30);
        sp.x = res[0]; sp.z = res[1];
      }

      var moving = (mx !== 0 || mz !== 0);
      sp.walkPhase += dt * (moving ? 3.2 : 0.9);

      if(moving){
        var pc = Math.cos(sp.walkPhase);
        var c = Math.cos(sp.walkPhase - dt * 3.2);
        if(pc > 0 && c <= 0) spawnRing(sp.x + 30, sp.z, theme, 12);
        else if(pc < 0 && c >= 0) spawnRing(sp.x - 30, sp.z, theme, 12);
      }
    }
  }
  function updateBullets(dt){
    for(var i = eBullets.length - 1; i >= 0; i--){
      var b = eBullets[i];
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      b.life -= dt;
      var dx = b.x - player.x, dy = b.y - 55, dz = b.z - player.z;
      if(dx*dx + dy*dy + dz*dz < 22*22){
        player.hp -= b.dmg; dmgT = 0.3;
        sparks(b.x, b.y, b.z, 3, ENEMY_RED);
        eBullets.splice(i, 1);
        if(player.hp <= 0){ player.hp = 0; gameOver(); }
        continue;
      }
      dx = b.x - ally.x; dy = b.y - 38; dz = b.z - ally.z;
      if(ally.downT <= 0 && dx*dx + dy*dy + dz*dz < 14*14){
        ally.hp -= b.dmg * 0.8;
        sparks(b.x, b.y, b.z, 2, ALLY_GREEN_HI);
        eBullets.splice(i, 1);
        if(ally.hp <= 0){ ally.hp = 0; ally.downT = 6; killFeed("VIPER-2 DOWN"); }
        continue;
      }
      if(pointInBuilding(b.x, b.z, b.y) || b.y < 0 || b.y > 260 || b.life <= 0){
        eBullets.splice(i, 1);
      }
    }
  }
  function updateBlasts(dt){
    for(var i = blasts.length - 1; i >= 0; i--){
      var bw = blasts[i];
      bw.life -= dt;
      bw.radius = bw.maxR * (1 - bw.life / bw.maxLife);
      if(!bw.applied && bw.radius > 5){
        var dx = player.x - bw.x, dz = player.z - bw.z;
        if(Math.sqrt(dx*dx + dz*dz) < bw.radius){
          player.hp -= 28; dmgT = 0.4; bw.applied = true;
          if(player.hp <= 0){ player.hp = 0; gameOver(); }
        }
        dx = ally.x - bw.x; dz = ally.z - bw.z;
        if(ally.downT <= 0 && Math.sqrt(dx*dx + dz*dz) < bw.radius){
          ally.hp -= 20; bw.applied = true;
          if(ally.hp <= 0){ ally.hp = 0; ally.downT = 6; killFeed("VIPER-2 DOWN"); }
        }
      }
      if(bw.life <= 0) blasts.splice(i, 1);
    }
  }
  function updateCrystals(){
    var i;
    for(i = 0; i < crystals.length; i++){
      var c = crystals[i];
      if(!c.alive) continue;
      c.spin += 0.02;
      var dx = c.x - player.x, dz = c.z - player.z;
      if(Math.sqrt(dx*dx + dz*dz) < 34){
        c.alive = false;
        player.reserve = Math.min(240, player.reserve + 36);
        score += 50;
        killFeed("AMMO CRYSTAL +36");
        spawnRing(c.x, c.z, "#22cc55", 22);
        respawnCrystal(crystals, i);
      }
    }
    for(i = 0; i < healthCrystals.length; i++){
      var h = healthCrystals[i];
      if(!h.alive) continue;
      h.spin += 0.025;
      var dx2 = h.x - player.x, dz2 = h.z - player.z;
      if(Math.sqrt(dx2*dx2 + dz2*dz2) < 34){
        h.alive = false;
        player.hp = Math.min(100, player.hp + 40);
        score += 50;
        killFeed("REPAIR CRYSTAL +40");
        spawnRing(h.x, h.z, "#9944cc", 22);
        respawnCrystal(healthCrystals, i);
      }
    }
  }
  function respawnCrystal(list, idx){
    setTimeout(function(){
      var x, z, tries = 0;
      do { x = rnd(-ARENA + 100, ARENA - 100); z = rnd(-ARENA + 100, ARENA - 100); tries++; }
      while(isNearBuilding(x, z, 40) && tries < 200);
      list[idx].x = x; list[idx].z = z; list[idx].alive = true;
    }, 6000);
  }
  function updateWaves(dt){
    if(ended) return;
    gameTime += dt;
    if(pauseT > 0){
      pauseT -= dt;
      if(pauseT <= 0){
        wave++;
        waveRSpawn = 0; waveSSpawn = 0; waveDSpawn = 0;
        waveTextT = 3.0;
        spawnT = 0.5;
      }
      return;
    }
    if(waveTextT > 0) waveTextT -= dt;
    spawnT -= dt;
    if(spawnT <= 0){
      spawnT = 1.6;
      var tot = waveTotals(wave);
      if(waveRSpawn < tot.r && enemies.length < 8){ spawnEnemy(); waveRSpawn++; }
      else if(waveSSpawn < tot.s && spiders.length < 4){ spawnSpider(); waveSSpawn++; }
      else if(waveDSpawn < tot.d && enemies.length < 10){ spawnEnemy(); waveDSpawn++; }
    }
    var tot2 = waveTotals(wave);
    if(waveRSpawn >= tot2.r && waveSSpawn >= tot2.s && waveDSpawn >= tot2.d && enemies.length === 0 && spiders.length === 0){
      if(wave >= 10){
        victory = true; ended = true;
        score += 5000;
        showEnd(true);
        return;
      }
      pauseT = 4.0;
      score += wave * 600;
      killFeed("WAVE " + wave + " CLEARED +" + wave * 600);
    }
  }

  /* ==================================================================
     19. LOCK-ON SYSTEM
     ================================================================== */
  function acquireLock(){
    var d = camForward(), best = null, bestA = 0.42;
    var i, e, c;
    for(i = 0; i < enemies.length; i++){
      e = enemies[i]; c = angErr(cam, d, e.x, 52, e.z);
      if(c.ang < bestA && c.dist < 900){ bestA = c.ang; best = e; }
    }
    for(i = 0; i < spiders.length; i++){
      e = spiders[i]; c = angErr(cam, d, e.x, SPIDER_BODY_H, e.z);
      if(c.ang < bestA && c.dist < 1000){ bestA = c.ang; best = e; }
    }
    if(best){ lockTarget = best; showToast("TARGET LOCKED"); }
    else showToast("NO TARGET IN CONE");
  }
  function cycleLock(){
    var cands = [], d = camForward(), i, e, c;
    for(i = 0; i < enemies.length; i++){
      e = enemies[i]; c = angErr(cam, d, e.x, 52, e.z);
      if(c.dist < 1000) cands.push({ ref: e, a: c.ang });
    }
    for(i = 0; i < spiders.length; i++){
      e = spiders[i]; c = angErr(cam, d, e.x, SPIDER_BODY_H, e.z);
      if(c.dist < 1000) cands.push({ ref: e, a: c.ang });
    }
    cands.sort(function(a, b){ return a.a - b.a; });
    if(cands.length === 0){ lockTarget = null; return; }
    var idx = lockTarget ? cands.findIndex(function(x){ return x.ref === lockTarget; }) : -1;
    lockTarget = cands[(idx + 1) % cands.length].ref;
    showToast("TARGET CYCLED");
  }
  function updateLock(dt){
    if(lockTarget){
      var isAlive = (enemies.indexOf(lockTarget) >= 0) || (spiders.indexOf(lockTarget) >= 0);
      if(lockTarget.hp <= 0 || !isAlive) lockTarget = null;
    }
    if(lockTarget){
      var tx = lockTarget.x, tz = lockTarget.z;
      var want = Math.atan2(tx - player.x, tz - player.z);
      cam.yaw = lerpAngle(cam.yaw, want, 1 - Math.exp(-2.0 * dt));
    }
  }
  function renderLock(){
    if(!lockTarget){ LOCKG.setAttribute("opacity", "0"); return; }
    var ty = lockTarget.class === "spider" ? SPIDER_BODY_H : 52;
    var s = worldScreen(lockTarget.x, ty, lockTarget.z);
    if(!s){ LOCKG.setAttribute("opacity", "0"); return; }
    LOCKG.setAttribute("opacity", "1");
    var sc = clamp(3000 / s.d, 0.55, 2.4);
    if(lockTarget.class === "spider") sc *= 1.35;
    LOCKG.setAttribute("transform",
      "translate(" + s.sx.toFixed(1) + "," + s.sy.toFixed(1) + ") scale(" + sc.toFixed(2) + ")");
    LK_HP.setAttribute("width", (94 * lockTarget.hp / lockTarget.maxHp).toFixed(1));
    var label = lockTarget.class === "spider" ? "QUAD SPIDER" : "M88 HOSTILE";
    LK_T.textContent = label + " // " + Math.max(0, Math.round(lockTarget.hp)) + " HP";
  }

  function renderScene(t){

      if(Math.sqrt(dx2*dx2 + dz2*dz2) > FAR) continue;
      var by2 = 22 + Math.sin(t * 0.004 + h.spin) * 8;
      var m2 = mul(mul(TR(h.x, by2, h.z), RY(h.spin)), RX(0.4));
      pushOcta(m2, 16, "#8833cc", 1.7);

    scCur = SC_ENEMY;

    };

    for(i = 0; i < spiders.length; i++){
      var sp = spiders[i];

      if(Math.sqrt(sdx*sdx + sdz*sdz) > FAR) continue;
      buildSpider({
        x: sp.x, z: sp.z,
        facing: sp.facing,
        phase: sp.walkPhase,
        walkPhase: sp.walkPhase,
        attackPhase: sp.attackPhase || 0,
        downed: false
      });
    }

    scCur = SC_FX;
    for(i = 0; i < eBullets.length; i++){
      var b = eBullets[i];
      var bdx = b.x - cam.x, bdz = b.z - cam.z;
      if(Math.sqrt(bdx*bdx + bdz*bdz) > FAR) continue;
      pushOcta(mul(TR(b.x, b.y, b.z), RY(t * 6 + i)), 3.4, ENEMY_RED, 1.2);
    }

    scCur = SC_ALLY;
    var aPose = {
      x: ally.x, z: ally.z, facing: ally.facing, phase: ally.phase,

    };
    buildM88(aPose, { scale: 0.72, colors: ALLY_COLORS }, 0);

    scCur = SC_PLAYER;
    var pPose = {
      x: player.x, z: player.z, facing: player.facing, phase: player.phase,
      gait: cur, aimBlend: aimBlend,
      muzzle: player.muzzle,
      footL: player.footL, footR: player.footR,
      downed: false
    };
    buildM88(pPose, { scale: 1.0, colors: PLAYER_COLORS }, player.jumpY);

    flushDraw();
  }

  function renderMinimap(t){
    var R = 104, scale = R / 1400, cy2 = Math.cos(cam.yaw), sy2 = Math.sin(cam.yaw);
    function toMap(wx, wz, o){
      var dx = wx - player.x, dz = wz - player.z;
      var rx = dx * cy2 - dz * sy2;
      var ry = dx * sy2 + dz * cy2;
      var d = Math.sqrt(rx*rx + ry*ry);
      var k = 1;
      if(d * scale > R - 6) k = (R - 6) / (d * scale);
      o.x = rx * scale * k; o.y = -ry * scale * k; o.edge = k < 1;
      return o;
    }
    var mo = { x:0, y:0, edge:false }, i, n;
    for(i = 0; i < 40; i++){
      var e = mmBlds[i];
      if(i >= buildings.length){ e.setAttribute("display", "none"); continue; }
      var b = buildings[i];
      toMap(b.x, b.z, mo);
      var sz = clamp(b.hx * scale * 1.4, 2, 10);
      e.setAttribute("x", (mo.x - sz / 2).toFixed(1));
      e.setAttribute("y", (mo.y - sz / 2).toFixed(1));
      e.setAttribute("width", sz.toFixed(1));
      e.setAttribute("height", sz.toFixed(1));
      e.setAttribute("opacity", mo.edge ? "0.35" : "0.75");
      e.removeAttribute("display");
    }
    n = 0;
    for(i = 0; i < enemies.length && n < 26; i++){
      var e2 = mmEn[n++];
      toMap(enemies[i].x, enemies[i].z, mo);
      e2.setAttribute("cx", mo.x.toFixed(1));
      e2.setAttribute("cy", mo.y.toFixed(1));
      e2.setAttribute("r", "4.5");
      e2.setAttribute("fill", ENEMY_RED);
      e2.setAttribute("opacity", mo.edge ? "0.4" : "1");
      e2.removeAttribute("display");
    }
    for(i = 0; i < spiders.length && n < 26; i++){
      var e2b = mmEn[n++];
      toMap(spiders[i].x, spiders[i].z, mo);
      e2b.setAttribute("cx", mo.x.toFixed(1));
      e2b.setAttribute("cy", mo.y.toFixed(1));
      e2b.setAttribute("r", "7");
      e2b.setAttribute("fill", "#e83a3a");
      e2b.setAttribute("opacity", mo.edge ? "0.4" : "1");
      e2b.removeAttribute("display");
    }
    for(i = n; i < 26; i++) mmEn[i].setAttribute("display", "none");
    n = 0;
    for(i = 0; i < crystals.length && n < 12; i++){
      if(!crystals[i].alive) continue;
      var e4 = mmCr[n++];
      toMap(crystals[i].x, crystals[i].z, mo);
      e4.setAttribute("cx", mo.x.toFixed(1)); e4.setAttribute("cy", mo.y.toFixed(1));
      e4.setAttribute("fill", "#00aa44");
      e4.setAttribute("opacity", mo.edge ? "0.3" : "0.85");
      e4.removeAttribute("display");
    }
    for(i = 0; i < healthCrystals.length && n < 12; i++){
      if(!healthCrystals[i].alive) continue;
      var e5 = mmCr[n++];
      toMap(healthCrystals[i].x, healthCrystals[i].z, mo);
      e5.setAttribute("cx", mo.x.toFixed(1)); e5.setAttribute("cy", mo.y.toFixed(1));
      e5.setAttribute("fill", "#8833cc");
      e5.setAttribute("opacity", mo.edge ? "0.3" : "0.85");
      e5.removeAttribute("display");
    }
    for(i = n; i < 12; i++) mmCr[i].setAttribute("display", "none");
    toMap(ally.x, ally.z, mo);
    M_ALLY.setAttribute("cx", mo.x.toFixed(1));
    M_ALLY.setAttribute("cy", mo.y.toFixed(1));
    M_ALLY.setAttribute("opacity", ally.downT > 0 ? "0.3" : "1");
    MSWEEP.setAttribute("transform", "rotate(" + ((t * 57) % 360).toFixed(1) + ")");
  }

    ally.x = 26; ally.z = -14; ally.hp = 60; ally.downT = 0;
    ally.target = null; ally.fireT = 0; ally.burst = 0;
    enemies.length = 0; spiders.length = 0; eBullets.length = 0; blasts.length = 0;
    tracers.length = 0; impacts.length = 0; explosions.length = 0;
    wave = 1; waveRSpawn = 0; waveSSpawn = 0; waveDSpawn = 0;
    spawnT = 1; pauseT = 0; waveTextT = 3;
    score = 0; kills = 0; gameTime = 0;
    ended = false; victory = false; lockTarget = null;
    cam.yaw = 0; cam.pitch = -0.18;
    generateWorld();
    showToast("REDEPLOYED");
  }

  /* ==================================================================
     24. INPUT KEYBOARD
     ================================================================== */
  var CYCLE = ["AUTO", "IDLE", "WALK", "RUN"];
  function setAnim(m){ animMode = m; showToast(m === "AUTO" ? "AUTO GAIT" : m + " CYCLE"); }
  function cycleAnim(){ setAnim(CYCLE[(CYCLE.indexOf(animMode) + 1) % CYCLE.length]); }
  function doJump(){
    if(player.jumping) return;
    player.jumping = true;
    player.jumpV = 380;
    showToast("HOP");
  }

  window.addEventListener("keydown", function(e){
    keys[e.code] = true;
    if(e.code === "Tab" || e.code === "Space" || e.code.indexOf("Arrow") === 0) e.preventDefault();
    if(!started) return;
    if(e.code === "Digit1") setAnim("IDLE");
    else if(e.code === "Digit2") setAnim("WALK");
    else if(e.code === "Digit3") setAnim("RUN");
    else if(e.code === "Digit4") setAnim("AUTO");
    else if(e.code === "KeyT" || e.code === "Tab") cycleAnim();
    else if(e.code === "KeyR") startReload();
    else if(e.code === "KeyQ"){ if(lockTarget) lockTarget = null; else acquireLock(); }
    else if(e.code === "KeyE") cycleLock();
    else if(e.code === "KeyF") cam.yaw = player.facing;
    else if(e.code === "Space") doJump();
    else if(e.code === "Digit0"){
      if(!oscReady) initOscilloscope();
      if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
      oscOn = !oscOn;
      showToast(oscOn ? "OSCILLOSCOPE ON" : "OSCILLOSCOPE OFF");
    }
    else if(e.code === "BracketLeft"){
      OSC_BUDGET = Math.max(400, OSC_BUDGET - 200);
      showToast("SCOPE " + OSC_BUDGET + " SAMPLES");
    }
    else if(e.code === "BracketRight"){
      OSC_BUDGET = Math.min(4000, OSC_BUDGET + 200);
      showToast("SCOPE " + OSC_BUDGET + " SAMPLES");
    }
  });
  window.addEventListener("keyup", function(e){ keys[e.code] = false; });
  window.addEventListener("blur", function(){ keys = {}; mouseDown = false; aimDown = false; });

  /* ==================================================================
     25. INPUT MOUSE — moving mouse target for LB aim-shoot
     ================================================================== */
  function tryLock(){ if(SVGEL.requestPointerLock) try{ SVGEL.requestPointerLock(); }catch(ex){} }
  document.addEventListener("pointerlockchange", function(){
    locked = document.pointerLockElement === SVGEL;
  });
  var dragging = false, lmx = 0, lmy = 0;
  window.addEventListener("mousemove", function(e){
    if(touchActivated) return;
    /* always track the moving mouse target for LB aim-shoot */
    var rect = SVGEL.getBoundingClientRect();
    var sx = (e.clientX - rect.left) / rect.width * SW;
    var sy = (e.clientY - rect.top) / rect.height * SH;
    mouseTargetX = sx; mouseTargetY = sy;
    if(locked){
      cam.yaw += e.movementX * 0.0026;
      cam.pitch = clamp(cam.pitch - e.movementY * 0.0026, -1.05, 0.45);
    } else if(dragging){
      cam.yaw += (e.clientX - lmx) * 0.005;
      cam.pitch = clamp(cam.pitch - (e.clientY - lmy) * 0.005, -1.05, 0.45);
      lmx = e.clientX; lmy = e.clientY;
    }
  });
  window.addEventListener("mousedown", function(e){
    if(touchActivated) return;
    if(!started){ startGame(); return; }
    if(ended){ restart(); return; }
    if(e.button === 0) mouseDown = true;
    if(e.button === 2) aimDown = true;
    if(!locked){ dragging = true; lmx = e.clientX; lmy = e.clientY; tryLock(); }
  });
  window.addEventListener("mouseup", function(e){
    if(touchActivated) return;
    if(e.button === 0) mouseDown = false;
    if(e.button === 2) aimDown = false;
    dragging = false;
  });
  window.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  window.addEventListener("wheel", function(e){
    if(touchActivated) return;
    cam.distBase = clamp(cam.distBase + e.deltaY * 0.35, 130, 500);
  }, { passive: true });

  /* ==================================================================
     26. INPUT TOUCH (Android controls)
     ================================================================== */
  function enableTouch(){
    if(touchActivated) return;
    touchDetected = true;
    touchActivated = true;
    gTouch.removeAttribute("display");
    gMenu.setAttribute("display", "none");
    showToast("TOUCH CONTROLS ON");
    lockHint.setAttribute("opacity", "0");
    if(!started) startGame();
  }

  function hitCircle(elem, x, y){
    if(!elem) return false;
    var rect = elem.getBoundingClientRect();
    var cx = rect.left + rect.width * 0.5;
    var cy = rect.top + rect.height * 0.5;
    var r = Math.max(rect.width, rect.height) * 0.5;
    var dx = x - cx, dy = y - cy;
    return dx*dx + dy*dy <= r*r;
  }

  function handleTouchStart(e){
    if(!touchActivated){
      enableTouch();
      e.preventDefault();
      return;
    }
    if(!started){ startGame(); e.preventDefault(); return; }
    if(ended){ restart(); e.preventDefault(); return; }

    var tch = e.changedTouches;
    for(var i = 0; i < tch.length; i++){
      var t = tch[i];
      var x = t.clientX, y = t.clientY;
      var handled = false;

      if(hitCircle(document.getElementById("TC_FIRE").querySelector("circle"), x, y)){ tFire = true; handled = true; }
      else if(hitCircle(document.getElementById("TC_ADS").querySelector("circle"), x, y)){ tAim = true; handled = true; }
      else if(hitCircle(document.getElementById("TC_REL").querySelector("circle"), x, y)){ startReload(); handled = true; }
      else if(hitCircle(document.getElementById("TC_LOCK").querySelector("circle"), x, y)){ if(lockTarget) lockTarget = null; else acquireLock(); handled = true; }
      else if(hitCircle(document.getElementById("TC_GAIT").querySelector("circle"), x, y)){ cycleAnim(); handled = true; }
      else if(hitCircle(document.getElementById("TC_TGT").querySelector("circle"), x, y)){ cycleLock(); handled = true; }
      else if(hitCircle(document.getElementById("TC_JUMP").querySelector("circle"), x, y)){ doJump(); handled = true; }
      else if(hitCircle(document.getElementById("OSCB").querySelector("circle"), x, y)){ toggleOSC(); handled = true; }
      else if(hitCircle(document.getElementById("TC_UP").querySelector("circle"), x, y)){ tUp = true; checkDpadSprint(); handled = true; }
      else if(hitCircle(document.getElementById("TC_DN").querySelector("circle"), x, y)){ tDn = true; checkDpadSprint(); handled = true; }
      else if(hitCircle(document.getElementById("TC_LT").querySelector("circle"), x, y)){ tLf = true; checkDpadSprint(); handled = true; }
      else if(hitCircle(document.getElementById("TC_RT").querySelector("circle"), x, y)){ tRt = true; checkDpadSprint(); handled = true; }

      if(!handled){
        if(dragTouchId < 0){
          dragTouchId = t.identifier;
          dragLastX = x;
          dragLastY = y;
        }
      }
    }
    e.preventDefault();
  }
  function handleTouchMove(e){
    if(!touchActivated) return;
    var tch = e.changedTouches;
    for(var i = 0; i < tch.length; i++){
      var t = tch[i];
      if(t.identifier === dragTouchId){
        var dx = t.clientX - dragLastX;
        var dy = t.clientY - dragLastY;
        cam.yaw += dx * 0.006;
        cam.pitch = clamp(cam.pitch - dy * 0.006, -1.05, 0.45);
        dragLastX = t.clientX;
        dragLastY = t.clientY;
      }
    }
    if(tch.length >= 2){
      var t1 = tch[0], t2 = tch[1];
      var pdx = t2.clientX - t1.clientX, pdy = t2.clientY - t1.clientY;
      var d = Math.sqrt(pdx*pdx + pdy*pdy);
      if(pinchStart > 0){
        var delta = (pinchStart - d) * 0.35;
        cam.distBase = clamp(cam.distBase + delta, 130, 500);
      }
      pinchStart = d;
    }
    e.preventDefault();
  }
  function handleTouchEnd(e){
    var tch = e.changedTouches;
    for(var i = 0; i < tch.length; i++){
      var t = tch[i];
      if(t.identifier === dragTouchId){
        dragTouchId = -1;
      }
    }
    if(tch.length >= 1){
      tUp = tDn = tLf = tRt = false;
      var still = e.touches;
      for(var j = 0; j < still.length; j++){
        var s = still[j];
        if(hitCircle(document.getElementById("TC_UP").querySelector("circle"), s.clientX, s.clientY)) tUp = true;
        if(hitCircle(document.getElementById("TC_DN").querySelector("circle"), s.clientX, s.clientY)) tDn = true;
        if(hitCircle(document.getElementById("TC_LT").querySelector("circle"), s.clientX, s.clientY)) tLf = true;
        if(hitCircle(document.getElementById("TC_RT").querySelector("circle"), s.clientX, s.clientY)) tRt = true;
      }
      if(still.length === 0){
        tFire = false; tAim = false;
        pinchStart = 0;
      }
    }
    e.preventDefault();
  }
  function checkDpadSprint(){
    var now = performance.now();
    if(now - lastDpadTap < 300) dpadSprint = true;
    else dpadSprint = false;
    lastDpadTap = now;
    setTimeout(function(){ dpadSprint = false; }, 900);
  }
  function toggleOSC(){
    if(!oscReady) initOscilloscope();
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    oscOn = !oscOn;
    showToast(oscOn ? "OSCILLOSCOPE ON" : "OSCILLOSCOPE OFF");
  }

  document.addEventListener("touchstart", handleTouchStart, { passive: false });
  document.addEventListener("touchmove", handleTouchMove, { passive: false });
  document.addEventListener("touchend", handleTouchEnd, { passive: false });
  document.addEventListener("touchcancel", handleTouchEnd, { passive: false });

  if(("ontouchstart" in window) || (navigator.maxTouchPoints > 0)){
    touchDetected = true;
  }

  /* ==================================================================
     27. GAMEPAD
     ------------------------------------------------------------------
     RT ......... FIRE PLASMA
     LT ......... ADS
     LB + MOVE .. AIM-SHOOT AT MOVING MOUSE TARGET
     RB ......... JUMP
     A .......... RELOAD
     X .......... LOCK-ON TOGGLE
     Y .......... CYCLE TARGET
     B .......... GAIT CYCLE
     L-STICK .... MOVE
     R-STICK .... ORBIT CAM
     D-PAD ...... MOVE
     START ...... DEPLOY / RESTART
     BACK ....... OSCILLOSCOPE TOGGLE
     ================================================================== */
  window.addEventListener("gamepadconnected", function(e){
    padConnected = true;
    padIndex = e.gamepad.index;
    padName = e.gamepad.id || "GAMEPAD";
    showToast("PAD CONNECTED");
    if(!started) startGame();
  });
  window.addEventListener("gamepaddisconnected", function(){
    padConnected = false;
    padIndex = -1;
    padName = "";
    padFire = false; padAim = false; padRB = false; padLB = false;
    padLbAimShoot = false; padLbAimActive = false;
    showToast("PAD DISCONNECTED");
  });

  function padBtnPressed(btn, name){
    var p = padPrev[name] === true;
    padPrev[name] = btn;
    return btn && !p;
  }
  function pollGamepad(dt){
    if(!padConnected) return;
    var gps = navigator.getGamepads ? navigator.getGamepads() : [];
    var gp = gps[padIndex];
    if(!gp) return;
    var b = gp.buttons;

    /* axes */
    padAxes.lx = gp.axes[0] || 0;
    padAxes.ly = gp.axes[1] || 0;
    padAxes.rx = gp.axes[2] || 0;
    padAxes.ry = gp.axes[3] || 0;

    /* face + shoulder buttons (standard mapping) */
    var aBtn  = b[0] ? b[0].pressed : false;
    var bBtn  = b[1] ? b[1].pressed : false;
    var xBtn  = b[2] ? b[2].pressed : false;
    var yBtn  = b[3] ? b[3].pressed : false;
    var lbBtn = b[4] ? b[4].pressed : false;
    var rbBtn = b[5] ? b[5].pressed : false;
    var ltBtn = b[6] ? b[6].value > 0.25 : false;
    var rtBtn = b[7] ? b[7].value > 0.25 : false;
    var startBtn = b[9] ? b[9].pressed : false;
    var backBtn  = b[8] ? b[8].pressed : false;

    /* edge-triggered actions */
    if(padBtnPressed(startBtn, "start")){
      if(!started) startGame();
      else if(ended) restart();
    }
    if(padBtnPressed(backBtn, "back")) toggleOSC();
    if(padBtnPressed(aBtn, "a")) startReload();
    if(padBtnPressed(xBtn, "x")){ if(lockTarget) lockTarget = null; else acquireLock(); }
    if(padBtnPressed(yBtn, "y")) cycleLock();
    if(padBtnPressed(bBtn, "b")) cycleAnim();
    if(padBtnPressed(rbBtn, "rb")) doJump();

    /* held states */
    padFire = rtBtn;
    padAim = ltBtn;
    padRB = rbBtn;
    padLB = lbBtn;

    /* LB + MOVE: activate aim-shoot at the moving mouse target */
    var stickMag = Math.sqrt(padAxes.lx * padAxes.lx + padAxes.ly * padAxes.ly);
    var moving = stickMag > PAD_DEADZONE;
    padLbAimActive = lbBtn && moving;
    padLbAimShoot = padLbAimActive;

    /* right stick orbits the camera */
    if(Math.abs(padAxes.rx) > PAD_DEADZONE){
      cam.yaw += padAxes.rx * 2.4 * dt;
    }
    if(Math.abs(padAxes.ry) > PAD_DEADZONE){
      cam.pitch = clamp(cam.pitch - padAxes.ry * 1.8 * dt, -1.05, 0.45);
    }
  }

  /* ==================================================================
     28. START / MENU
     ================================================================== */
  function startGame(){
    started = true;
    gMenu.setAttribute("display", "none");
    initOscilloscope();
    if(!touchActivated && !padConnected) tryLock();
    showToast("DEPLOYED");
  }
  gMenu.addEventListener("mousedown", function(e){
    if(!started) startGame();
    else if(ended) restart();
  });
  gMenu.addEventListener("touchstart", function(e){
    if(!touchActivated) enableTouch();
    if(!started) startGame();
    else if(ended) restart();
    e.preventDefault();
  }, { passive: false });

  /* ==================================================================
     29. MAIN LOOP
     ================================================================== */
  generateWorld();
  var lastT = performance.now();

  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    gdt = dt;
    var t = now / 1000;
    scBegin();

    pollGamepad(dt);

    if(started && !ended){
      updatePlayer(dt);
      updateAlly(dt);
      updateEnemies(dt);
      updateSpiders(dt);
      updateBullets(dt);
      updateBlasts(dt);
      updateCrystals();
      updateWaves(dt);
    } else if(started && ended){
      updateBlasts(dt);
    }
    updateLock(dt);
    updateVFX(dt);
    updateCamera(dt);

    drawList.length = 0;
    scCur = SC_BLD;
    renderFloor(t);

    renderShadowAt(player.x, player.z, 0, 16);
    renderShadowAt(ally.x, ally.z, 1, 11);
    if(lockTarget) renderShadowAt(lockTarget.x, lockTarget.z, 2, 16);
    if(spiders.length > 0) renderShadowAt(spiders[0].x, spiders[0].z, 3, 42);

    for(var i = 0; i < buildings.length; i++){
      var b = buildings[i];
      var bdx = b.x - cam.x, bdz = b.z - cam.z;
      var bDist = Math.sqrt(bdx*bdx + bdz*bdz);
      if(bDist > FAR + b.hx + b.hz) continue;
      var bright = Math.max(0.1, 1 - bDist / FAR);
      pushBox(TR(b.x, 0, b.z), 0, b.h * 0.5, 0, b.hx, b.h * 0.5, b.hz,
        b.h > 220 ? BUILDING_ORANGE_HI : BUILDING_ORANGE, 0.9 + bright * 1.1, 0.85);
    }

    renderScene(t);
    renderRings();
    renderMotes(t);
    renderVFX();
    renderLock();
    renderMinimap(t);
    updateHUD(dt);
    scopeCommit();
  }
  requestAnimationFrame(frame);

  })();
  ]]></script>
</svg>
