const PALETTE = ['#00ffcc','#ffcc00','#ff0055','#00e5ff','#ff7700','#c066ff','#7fff9f'];

/* ---------------- BUTTON FACTORY ---------------- */
function mkBtn(parent, x, y, w, h, label, cb, opts) {
  opts = opts || {};
  const g = el('g', { class: 'btn' + (opts.danger ? ' btn-danger' : ''), transform: 'translate(' + x + ',' + y + ')' }, parent);
  if (opts.id) g.setAttribute('id', opts.id);
  el('rect', { class: 'b', width: w, height: h, rx: opts.rx || 0 }, g);
  const fs = opts.fs || 12;
  el('text', { x: w / 2, y: h / 2 + fs * 0.36, 'font-size': fs, text: label }, g);
  g.addEventListener('click', (e) => { e.stopPropagation(); cb(e); });
  return g;
}
function mkBtnToggle(parent, x, y, w, h, label, active, cb, opts) {
  const b = mkBtn(parent, x, y, w, h, label, cb, opts);
  setActive(b, active);
  return b;
}
function setActive(btn, on) {
  const r = btn.querySelector('rect.b');
  const t = btn.querySelector('text');
  if (on) { r.setAttribute('fill', '#00ffcc'); t.setAttribute('fill', '#001510'); }
  else { r.setAttribute('fill', '#000a0e'); t.setAttribute('fill', '#00ffcc'); }
}

/* portrait: 130x116 local space, seeded procedural mobster bust */
function portraitMarkup(seed) {
  const r = mulberry32(seed);
  const A = PALETTE[Math.floor(r() * PALETTE.length)];
  const f = n => n.toFixed(1);
  const p = [];
  p.push('<rect width="130" height="116" fill="#040d0d"/>');
  p.push('<path d="M0 29H130M0 58H130M0 87H130M32 0V116M65 0V116M98 0V116" stroke="#0d2222" stroke-width="1"/>');
  if (r() < 0.55) p.push('<circle cx="65" cy="48" r="' + f(28 + r() * 12) + '" fill="none" stroke="' + A + '" stroke-width="1" opacity="0.3"/>');
  const hy = 46 + (r() * 4 - 2);           // head center y
  const ey = hy - 2;                        // eyes y
  const my = hy + 14;                       // mouth y
  // bust / shoulders (filled silhouette reaching the frame bottom)
  p.push('<path d="M10 116 Q12 ' + f(94 - r() * 4) + ' 48 ' + f(84 - r() * 3) + ' Q65 ' + f(78 - r() * 3) + ' 82 ' + f(84 - r() * 3) + ' Q118 ' + f(94 - r() * 4) + ' 120 116 Z" fill="#0a1a1a" stroke="' + A + '" stroke-width="1.6"/>');
  // tie + collar
  if (r() < 0.65) p.push('<path d="M60 88 L65 94 L70 88 L67 113 L63 113 Z" fill="' + A + '" opacity="0.9"/>');
  p.push('<path d="M50 86 L63 94 M80 86 L67 94" stroke="' + A + '" stroke-width="1" opacity="0.6" fill="none"/>');
  // neck connecting head to bust
  p.push('<path d="M57 ' + f(hy + 18) + ' H73 V82 H57 Z" fill="#0c1818" stroke="#e8e8e8" stroke-width="1.6"/>');
  // head
  p.push('<ellipse cx="65" cy="' + f(hy) + '" rx="20" ry="22" fill="#0c1818" stroke="#e8e8e8" stroke-width="1.8"/>');
  // eyes
  const eye = Math.floor(r() * 3);
  if (eye === 0) {
    p.push('<circle cx="57" cy="' + f(ey) + '" r="5" fill="' + A + '" opacity="0.25"/><circle cx="73" cy="' + f(ey) + '" r="5" fill="' + A + '" opacity="0.25"/>');
    p.push('<circle cx="57" cy="' + f(ey) + '" r="2.6" fill="' + A + '"/><circle cx="73" cy="' + f(ey) + '" r="2.6" fill="' + A + '"/>');
  } else if (eye === 1) {
    p.push('<path d="M52 ' + f(ey) + 'H61 M69 ' + f(ey) + 'H78" stroke="' + A + '" stroke-width="2.4"/>');
  } else {
    p.push('<rect x="52" y="' + f(ey - 4) + '" width="26" height="8" fill="rgba(0,0,0,0.4)" stroke="' + A + '" stroke-width="1.4"/><path d="M52 ' + f(ey) + 'H78" stroke="' + A + '" stroke-width="1"/>');
  }
  if (r() < 0.75) p.push('<path d="M53 ' + f(ey - 6) + 'H61 M69 ' + f(ey - 6) + 'H78" stroke="#e8e8e8" stroke-width="1.6"/>');
  // nose
  p.push('<path d="M65 ' + f(ey + 2) + ' L63 ' + f(ey + 10) + ' H67" stroke="#8a8a8a" stroke-width="1.1" fill="none"/>');
  // mouth
  const mo = Math.floor(r() * 4);
  if (mo === 0) p.push('<path d="M58 ' + f(my) + 'H72" stroke="#e8e8e8" stroke-width="1.8"/>');
  else if (mo === 1) p.push('<path d="M58 ' + f(my + 1) + ' Q65 ' + f(my - 4) + ' 72 ' + f(my + 1) + '" stroke="#e8e8e8" stroke-width="1.6" fill="none"/>');
  else if (mo === 2) p.push('<path d="M58 ' + f(my) + 'H72 M61 ' + f(my) + ' L60 ' + f(my + 4) + ' M69 ' + f(my) + ' L70 ' + f(my + 4) + '" stroke="#e8e8e8" stroke-width="1.2"/>');
  else p.push('<path d="M59 ' + f(my) + 'H71" stroke="#e8e8e8" stroke-width="1.6"/><path d="M71 ' + f(my - 1) + ' L79 ' + f(my + 3) + '" stroke="#ffffff" stroke-width="2"/>');
  if (r() < 0.4) p.push('<path d="M56 ' + f(my - 3) + ' Q65 ' + f(my + 3) + ' 74 ' + f(my - 3) + '" stroke="#e8e8e8" stroke-width="1.7" fill="none"/>');
  // hats / hair
  const hat = Math.floor(r() * 5);
  if (hat === 0) { // fedora
    p.push('<path d="M46 26 Q46 12 65 12 Q84 12 84 26 Z" fill="#101d1d" stroke="' + A + '" stroke-width="1.6"/>');
    p.push('<path d="M41 26 H89" stroke="' + A + '" stroke-width="2.6"/><path d="M46 20 H84" stroke="' + A + '" stroke-width="1" opacity="0.7"/>');
  } else if (hat === 1) { // flat cap
    p.push('<path d="M47 27 Q47 13 65 13 Q83 13 83 27 Z" fill="#101d1d" stroke="' + A + '" stroke-width="1.6"/>');
    p.push('<path d="M65 13 L96 28 L83 27" fill="#101d1d" stroke="' + A + '" stroke-width="1.4"/>');
  } else if (hat === 2) { // bandana
    p.push('<path d="M46 29 Q46 15 65 15 Q84 15 84 29 L84 33 Q65 27 46 33 Z" fill="' + A + '" opacity="0.4" stroke="' + A + '" stroke-width="1"/>');
  } else if (hat === 3) { // hair
    p.push('<path d="M46 ' + f(hy - 2) + ' Q46 ' + f(hy - 24) + ' 65 ' + f(hy - 24) + ' Q84 ' + f(hy - 24) + ' 84 ' + f(hy - 2) + ' Q78 ' + f(hy - 18) + ' 65 ' + f(hy - 17) + ' Q52 ' + f(hy - 18) + ' 46 ' + f(hy - 2) + ' Z" fill="' + A + '" opacity="0.85"/>');
  }
  if (r() < 0.3) p.push('<circle cx="84" cy="' + f(hy + 4) + '" r="2" fill="' + A + '"/>');
  if (r() < 0.2) p.push('<path d="M50 ' + f(ey + 12) + ' L60 ' + f(ey + 18) + '" stroke="#ff8899" stroke-width="1.2" opacity="0.8"/>');
  p.push('<path d="M6 14 V6 H14 M116 6 H124 V14 M124 102 V110 H116 M14 110 H6 V102" stroke="' + A + '" stroke-width="1.5" fill="none" opacity="0.9"/>');
  return p.join('');
}

/* full card markup (inline art; custom face image layered on top if present) */
function cardMarkup(p, showBack) {
  const dead = !p.alive;
  const frameColor = dead ? '#555555' : (p.id === G.meId ? '#ffe98a' : '#00ffcc');
  const portrait = '<g class="portrait">' + portraitMarkup(p.seed) + '</g>';
  const custom = p.faceSrc ? '<image x="10" y="26" width="130" height="116" href="' + p.faceSrc + '" preserveAspectRatio="xMidYMid slice"/>' : '';
  let roleText, roleFill;
  if (dead || G.allRevealed) { roleText = p.role; roleFill = ROLE_COLOR[p.role]; }
  else if (p.id === G.meId) { roleText = 'YOU'; roleFill = '#ffe98a'; }
  else { roleText = '?????'; roleFill = '#3a6a64'; }
  const meP = G.players[G.meId];
  const crew = meP && meP.role === 'MAFIA' && p.role === 'MAFIA' && p.id !== G.meId && !dead;
  const crewMark = crew ? '<path d="M150 40 L150 58 L134 40 Z" fill="#ff0055" opacity="0.9"/><text x="143" y="72" text-anchor="end" fill="#ff0055" font-size="9" letter-spacing="1" pointer-events="none">CREW</text>' : '';
  const youB = (p.id === G.meId && !dead) ? '<path d="M0 14 V0 H14 M136 0 H150 V14 M150 181 V195 H136 M14 195 H0 V181" stroke="#ffe98a" stroke-width="2.4" fill="none" pointer-events="none"/>' : '';
  let deadArt = '';
  if (dead) {
    const fresh = G.animDead === p.id;
    deadArt = '<rect x="10" y="26" width="130" height="116" class="card-dead"/>' +
      '<path class="drawx' + (fresh ? ' drawxin' : '') + '" d="M12 28 L138 140 M138 28 L12 140" fill="none"/>' +
      '<text x="75" y="92" class="stamp' + (fresh ? ' stampin' : '') + '">OUT</text>';
  }
  const counts = voteCounts();
  let chip = '';
  if (G.phase === 'DAY' && counts[p.id]) {
    chip = '<g transform="translate(133,18)"><g class="' + (G.animVote ? 'popin' : '') + '">' +
      '<circle r="12" fill="#ffcc00" stroke="#000000" stroke-width="1.5"/>' +
      '<text y="5" text-anchor="middle" fill="#000000" font-size="13" font-weight="bold" pointer-events="none">' + counts[p.id] + '</text></g></g>';
  }
  const face = '<g class="card-face"' + (showBack ? ' style="display:none"' : '') + '>' +
    '<rect width="150" height="195" class="card-frame" stroke="' + frameColor + '"/>' +
    '<rect x="10" y="26" width="130" height="116" class="card-portrait"/>' +
    '<g clip-path="url(#pc)">' + portrait + custom + '</g>' +
    '<rect x="10" y="26" width="130" height="116" fill="none" stroke="#1f4a46" stroke-width="1" pointer-events="none"/>' +
    '<path d="M10 44 V26 H28 M122 26 H140 V44 M140 124 V142 H122 M28 142 H10 V124" stroke="#00ffcc" stroke-width="1.2" fill="none" opacity="0.85" pointer-events="none"/>' +
    '<line x1="10" y1="150" x2="140" y2="150" stroke="#00ffcc" stroke-width="1" opacity="0.5"/>' +
    '<text x="75" y="168" class="card-name">' + esc(p.name) + '</text>' +
    '<text x="75" y="184" class="card-role" fill="' + roleFill + '">' + roleText + '</text>' +
    youB + crewMark + deadArt + chip +
    '</g>';
  const back = '<g class="card-back"' + (showBack ? '' : ' style="display:none"') + '>' + cardBackMarkup() + '</g>';
  return '<g class="card-inner"><g class="float" style="animation-delay:' + (-(p.id * 0.7) % 4.6).toFixed(2) + 's">' + face + back + '</g></g>' +
    '<rect class="card-hit" width="150" height="195"/>';
}

const BOOT_LINES = [
  '> DECK GENESIS BIOS v3.0 ............ OK',
  '> EMBEDDED VECTOR ART CORE .......... OK',
  '> CARD DEAL ANIMATION ENGINE ........ OK',
  '> LINKING GITHUB BRIDGE ............. OK',
  '> CALIBRATING Y2K VECTOR HUD ........ OK',
  '> ROLES: MAFIA / DETECTIVE / DOCTOR . OK',
  '> DAY-NIGHT CYCLE DRIVER ............ OK',
  '> SYSTEM READY.'
];
let bootDone = false;
function runBoot() {
  const log = $('boot-log');
  clear(log);
  let i = 0;
  const total = BOOT_LINES.length;
  function step() {
    if (bootDone) return;
    if (i < total) {
      const t = el('text', { x: 0, y: i * 22, class: 'hud-dim', 'font-size': 12.5, text: BOOT_LINES[i] }, log);
      t.setAttribute('fill', i === total - 1 ? '#ffcc00' : '#8fe8dc');
      i++;
      const pct = Math.round((i / total) * 100);
      $('boot-bar').setAttribute('width', pct * 4.8);
      $('boot-pct').textContent = pct + '%';
      addTimer(step, 240);
    } else finishBoot();
  }
  addTimer(step, 300);
}
function finishBoot() {
  if (bootDone) return;
  bootDone = true;
  clearTimers();
  const log = $('boot-log');
  clear(log);
  BOOT_LINES.forEach((l, i) => {
    const t = el('text', { x: 0, y: i * 22, class: 'hud-dim', 'font-size': 12.5, text: l }, log);
    t.setAttribute('fill', i === BOOT_LINES.length - 1 ? '#ffcc00' : '#8fe8dc');
  });
  $('boot-bar').setAttribute('width', 480);
  $('boot-pct').textContent = '100%';
  const btns = $('boot-btns');
  clear(btns);
  mkBtn(btns, 0, 0, 150, 44, 'NEW GAME', () => { clearTimers(); openSetup(); }, { fs: 15 });
  if (hasSave()) mkBtn(btns, 170, 0, 150, 44, 'RESUME', () => { resumeGame(); }, { fs: 15 });
  setDisp(btns, true);
}
$('screen-boot').addEventListener('click', () => { if (!bootDone) finishBoot(); });

/* ============================================================
   SVG FACE LOADING - disk / drag-drop / github
   ============================================================ */
function addFace(src) {
  if (G.faces.length >= 24) { toast('FACE DECK FULL (24 MAX)', '#ffcc00'); return false; }
  G.faces.push({ src });
  return true;
}
function svgTextToFace(text, label) {
  const t = text.trim();
  if (!t.includes('<svg')) { toast('NOT AN SVG: ' + (label || 'file'), '#ff0055'); return false; }
  return addFace('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(t));
}
function setGhStatus(msg, color) {
  const s = document.getElementById('gh-status');
  if (!s) return;
  s.textContent = msg;
  s.setAttribute('fill', color || '#8fe8dc');
}
function fetchRawUrls() {
  const input = document.getElementById('gh-url');
  const urls = (input.value || '').split(/\s+/).filter(u => u.startsWith('http'));
  if (!urls.length) { toast('NO VALID URLS', '#ff0055'); return Promise.resolve(); }
  let ok = 0;
  const chain = urls.reduce(function(pr, url, i) {
    return pr.then(function() {
      setGhStatus('FETCHING ' + (i + 1) + '/' + urls.length + '...', '#ffcc00');
      return fetch(url).then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function(text) {
        if (svgTextToFace(text, url.split('/').pop())) ok++;
      }).catch(function() {
        toast('FETCH FAILED: ' + url.slice(0, 48) + '...', '#ff0055');
      });
    });
  }, Promise.resolve());
  return chain.then(function() {
    setGhStatus('FETCHED ' + ok + '/' + urls.length + ' FACES', ok ? '#33ff88' : '#ff0055');
    renderFaceGrid();
  });
}
function fetchRepoSvgs() {
  const input = document.getElementById('gh-repo');
  const parts = (input.value || '').trim().replace(/^https?:\/\/github\.com\//, '').split('/').filter(Boolean);
  if (parts.length < 2) { toast('USE owner/name[/subdir]', '#ff0055'); return Promise.resolve(); }
  const repo = parts[0] + '/' + parts[1];
  const subdir = parts.slice(2).join('/');
  setGhStatus('SCANNING REPO TREE...', '#ffcc00');
  let ghBranch = 'main';
  return fetch('https://api.github.com/repos/' + repo).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(info) {
    ghBranch = info.default_branch || 'main';
    return fetch('https://api.github.com/repos/' + repo + '/git/trees/' + ghBranch + '?recursive=1').then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }).then(function(tree) {
    let files = (tree.tree || []).filter(function(f) {
      return f.type === 'blob' && /\.svg$/i.test(f.path) && (f.size || 0) < 150000 &&
        (!subdir || f.path.toLowerCase().startsWith(subdir.toLowerCase() + '/'));
    });
    files.sort((a, b) => (a.size || 0) - (b.size || 0));
    files = files.slice(0, 18);
    if (!files.length) { setGhStatus('NO .SVG FILES FOUND IN REPO', '#ff0055'); return; }
    let ok = 0;
    const chain = files.reduce(function(pr, file, i) {
      return pr.then(function() {
        setGhStatus('FETCHING ' + (i + 1) + '/' + files.length + ': ' + file.path.split('/').pop().slice(0, 22), '#ffcc00');
        return fetch('https://raw.githubusercontent.com/' + repo + '/' + ghBranch + '/' + file.path).then(function(raw) {
          if (!raw.ok) throw new Error('HTTP ' + raw.status);
          return raw.text();
        }).then(function(text) {
          if (svgTextToFace(text, file.path.split('/').pop())) ok++;
        }).catch(function() { /* skip file */ });
      });
    }, Promise.resolve());
    return chain.then(function() {
      setGhStatus('DONE - ' + ok + ' FACES ADDED FROM ' + repo, ok ? '#33ff88' : '#ff0055');
      renderFaceGrid();
    });
  }).catch(function() {
    setGhStatus('REPO SCAN FAILED (RATE LIMIT / NETWORK)', '#ff0055');
    toast('REPO SCAN FAILED', '#ff0055');
  });
}
$('file-svg').addEventListener('change', (e) => {

    const reader = new FileReader();

    reader.readAsText(f);

  if (files.length) toast('READING ' + files.length + ' FILE(S)...', '#ffcc00');
  e.target.value = '';
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {

  if (!files.length) return;

/* ============================================================
   NEW GAME / DEAL
   ============================================================ */
function newGame() {
  clearTimers();
  const rs = ROLE_SET[G.cfg.size];
  const roles = [];
  for (let i = 0; i < rs.mafia; i++) roles.push('MAFIA');
  for (let i = 0; i < rs.det; i++) roles.push('DETECTIVE');
  for (let i = 0; i < rs.doc; i++) roles.push('DOCTOR');
  while (roles.length < G.cfg.size) roles.push('TOWN');
  const shRoles = shuffle(roles);
  const shNames = shuffle(NAMES).slice(0, G.cfg.size);
  G.players = shRoles.map((role, i) => {
    return {
      id: i, name: shNames[i], role,
      faction: role === 'MAFIA' ? 'MAFIA' : 'TOWN',
      alive: true, seed: 1000 + i * 37 + 5, faceSrc: G.faces.length ? G.faces[i % G.faces.length].src : null,
      knownMafia: null
    };
  });
  G.meId = Math.floor(Math.random() * G.players.length);
  G.turn = 1; G.phase = 'DAY'; G.await = null; G.votes = {}; G.votedThisDay = false;
  G.night = { kill: null, protect: null, investigated: null, save: false };
  G.gameOver = false; G.winner = null; G.allRevealed = false;
  G.log = [];
  showScreen('game');
  setDisp($('night-overlay'), false);
  setDisp($('game-over'), false);
  renderHUDButtons();
  log('A NEW GAME BEGINS. ' + G.players.length + ' CARDS ARE DEALT.', 'hdr');
  log('YOU ARE THE ' + me().role + '.', 'me');
  if (me().role === 'MAFIA') {
    const crew = G.players.filter(p => p.id !== G.meId && p.role === 'MAFIA').map(p => p.name);
    if (crew.length) log('YOUR CREW: ' + crew.join(', ') + '.', 'me');
  }
  toast('YOU ARE THE ' + me().role, ROLE_COLOR[me().role]);
  /* deal flight + flips, then day starts */
  G.dealing = true;
  renderCards(true);
  showBanner('THE DECK IS DEALT', '#00ffcc');
  ticker('DEALING CARDS...');
  const dealTotal = G.players.length * 90 + 1000;
  addTimer(() => { G.dealing = false; startDay(true); }, dealTotal);
}

/* ============================================================
   RENDERING
   ============================================================ */
function me() { return G.players[G.meId]; }
function alivePlayers() { return G.players.filter(p => p.alive); }
function aliveMafia() { return G.players.filter(p => p.alive && p.role === 'MAFIA'); }
function aliveTown() { return G.players.filter(p => p.alive && p.role !== 'MAFIA'); }

function voteCounts() {
  const counts = {};
  Object.values(G.votes).forEach(t => { counts[t] = (counts[t] || 0) + 1; });
  return counts;
}

function renderAll() { renderHUD(); renderCards(false); renderSlot(); renderLog(); }

/* grid position of a card in board-local coords */
function cardPos(p) {
  const n = G.players.length;
  const cols = n <= 8 ? 4 : 6;
  return { x: (p.id % cols) * 166, y: Math.floor(p.id / cols) * 212 };
}

/* opts.deal = animate deal flight + flips; instant render otherwise */
function renderCards(deal) {
  const grid = $('card-grid');
  clear(grid);
  G.players.forEach(function(p) {
    const pos = cardPos(p);
    const g = el('g', { class: 'card' + (p.alive ? '' : ' dead'), 'data-id': p.id }, grid);
    g.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px)';
    const showBack = !!deal;
    setSVG(g, cardMarkup(p, showBack));
    if (deal) {
      g.style.opacity = '0';
      g.style.transform = 'translate(' + DECK_POS.x + 'px,' + DECK_POS.y + 'px) scale(0.35) rotate(-9deg)';
      g.style.transition = 'none';
    }
    g.addEventListener('pointerdown', ev => startDrag(ev, p));
  });
  if (deal) {
    // force layout, then fly each card to its slot with a stagger
    void grid.getBoundingClientRect();
    G.players.forEach(function(p) {
      const g = grid.querySelector('.card[data-id="' + p.id + '"]');
      const pos = cardPos(p);
      addTimer(function() {
        g.style.transition = 'transform .62s cubic-bezier(.2,.85,.25,1), opacity .3s ease';
        g.style.opacity = '1';
        g.style.transform = 'translate(' + pos.x + 'px,' + pos.y + 'px) scale(1) rotate(0deg)';
      }, 60 + p.id * 90);
      addTimer(function() {
        // flip: back away, face in
        const face = g.querySelector('.card-face');
        const back = g.querySelector('.card-back');
        if (back) back.style.display = 'none';
        if (face) { face.style.display = ''; face.classList.add('flipin'); }
      }, 60 + p.id * 90 + 340);
    });
    addTimer(function() {
      grid.querySelectorAll('.card').forEach(function(g) { g.style.transition = 'none'; });
    }, 60 + G.players.length * 90 + 700);
  }
}

/* ============================================================
   DRAG & DROP
   ============================================================ */
function startDrag(ev, p) {
  if (G.screen !== 'game' || G.gameOver || G.dealing) return;
  if (!p.alive) { toast("DEAD CARDS DON'T ACT", '#888888'); return; }
  if (!G.await) { ticker(G.phase === 'NIGHT' ? 'NOTHING TO DO - AWAITING DAWN' : 'NO ACTION REQUIRED NOW'); return; }
  ev.preventDefault();
  G.activeDrag = p;
  const ghost = el('g', { class: 'drag-ghost' }, $('drag-layer'));
  const markup = '<g style="transform-box:fill-box;transform-origin:center;transform:rotate(3deg) scale(1.02)">' +
    '<rect width="150" height="195" fill="rgba(2,10,12,0.94)" stroke="#00ffcc" stroke-width="2"/>' +
    '<g clip-path="url(#pc)"><g>' + portraitMarkup(p.seed) + '</g>' +
    (p.faceSrc ? '<image x="10" y="26" width="130" height="116" href="' + p.faceSrc + '" preserveAspectRatio="xMidYMid slice"/>' : '') + '</g>' +
    '<text x="75" y="162" text-anchor="middle" fill="#d6f2ec" font-size="13" font-weight="bold">' + esc(p.name) + '</text>' +
    '<text x="75" y="182" text-anchor="middle" fill="#ffcc00" font-size="12" letter-spacing="2">' +
    ({ vote: 'VOTE', kill: 'KILL', protect: 'PROTECT', investigate: 'SCAN' }[G.await] || '') + '</text></g>';
  setSVG(ghost, markup);
  G.dragGhost = ghost;
  moveGhost(ev);
  window.addEventListener('pointermove', onDragMove);
  window.addEventListener('pointerup', onDragEnd, { once: true });
}
function moveGhost(ev) {
  const pt = screenToSVG(ev.clientX, ev.clientY);
  if (G.dragGhost) G.dragGhost.setAttribute('transform', 'translate(' + (pt.x - CARD_W / 2) + ',' + (pt.y - CARD_H / 2) + ')');
}
function onDragMove(ev) { moveGhost(ev); }
function onDragEnd(ev) {
  window.removeEventListener('pointermove', onDragMove);
  const p = G.activeDrag;
  if (G.dragGhost) { G.dragGhost.remove(); G.dragGhost = null; }
  G.activeDrag = null;
  if (!p) return;
  const pt = screenToSVG(ev.clientX, ev.clientY);
  const inSlot = pt.x > SLOT_RECT.x && pt.x < SLOT_RECT.x + SLOT_RECT.w && pt.y > SLOT_RECT.y && pt.y < SLOT_RECT.y + SLOT_RECT.h;
  if (inSlot) handleDrop(p);
}
function refuse(msg) { toast(msg, '#ff0055'); }
function handleDrop(p) {
  if (G.await === 'vote') {
    if (G.votedThisDay) { refuse('YOUR VOTE IS LOCKED'); return; }
    if (p.id === G.meId) { refuse('YOU CANNOT VOTE YOURSELF'); return; }
    castVote(me(), p);
  } else if (G.await === 'kill') {
    if (p.role === 'MAFIA') { refuse("CAN'T HIT YOUR OWN CREW"); return; }
    G.night.kill = p.id;
    log('YOU MARK ' + p.name + ' FOR DEATH.', 'me');
    ticker('THE HIT IS SCHEDULED...');
    renderSlot();
    saveGame();
    addTimer(resolveNight, 1100);
  } else if (G.await === 'protect') {
    G.night.protect = p.id;
    log('YOU STAND GUARD OVER ' + (p.id === G.meId ? 'YOURSELF' : p.name) + ' TONIGHT.', 'me');
    ticker('PROTECTION IN PLACE...');
    renderSlot();
    saveGame();
    addTimer(resolveNight, 1100);
  } else if (G.await === 'investigate') {
    if (p.id === G.meId) { refuse('YOU ALREADY KNOW YOURSELF'); return; }
    G.night.investigated = p.id;
    ticker('SCANNING ' + p.name + '...');
    renderSlot();
    saveGame();
    addTimer(resolveNight, 1100);
  }
}
/* ============================================================
   DAY / NIGHT CYCLE
   ============================================================ */
function startDay(first) {
  if (G.gameOver) return;
  G.phase = 'DAY';
  G.votes = {}; G.votedThisDay = false;
  setDisp($('night-overlay'), false);
  log('--- DAY ' + G.turn + ' ---', 'hdr');
  showBanner('DAY ' + G.turn + ' - THE TOWN GATHERS', '#ffcc00');
  if (me().alive) {
    G.await = 'vote';
    ticker('DRAG A CARD TO THE VOTE SLOT');
  } else {
    G.await = null;
    ticker('SPECTATOR MODE - THE TOWN DELIBERATES...');
    addTimer(aiDayResolve, 2400);
  }
  renderAll();
  saveGame();
}
function castVote(voter, target) {
  G.votes[voter.id] = target.id;
  if (voter.id === G.meId) {
    G.votedThisDay = true;
    log('YOU VOTE FOR ' + target.name + '.', 'me');
    G.await = null;
    G.animVote = true;
    renderHUD(); renderCards(false); renderSlot();
    G.animVote = false;
    saveGame();
    addTimer(aiDayResolve, 900);
  }
}
function aiDayResolve() {
  if (G.gameOver || G.phase !== 'DAY') return;
  alivePlayers().forEach(function(p) {
    if (p.id === G.meId && me().alive) return; // player vote already cast
    const pool = alivePlayers().filter(q => q.id !== p.id);
    if (!pool.length) return;
    let target;
    if (p.role === 'MAFIA') {
      const towns = pool.filter(q => q.role !== 'MAFIA');
      target = towns.length ? pick(towns) : pick(pool);
    } else if (p.role === 'DETECTIVE' && p.knownMafia !== null && G.players[p.knownMafia] && G.players[p.knownMafia].alive) {
      target = G.players[p.knownMafia];
    } else {
      target = pick(pool);
    }
    G.votes[p.id] = target.id;
    log(p.name + ' votes ' + target.name + '.');
  });
  G.animVote = true;
  renderCards(false);
  G.animVote = false;
  tallyVotes();
}
function tallyVotes() {
  const counts = voteCounts();
  const entries = Object.entries(counts);
  if (!entries.length) { log('NO VOTES WERE CAST.', 'sys'); startNight(); return; }
  let max = 0, leaders = [];
  entries.forEach(function(en) {
    const id = Number(en[0]), c = en[1];
    if (c > max) { max = c; leaders = [id]; }
    else if (c === max) leaders.push(id);
  });
  log('TALLY: ' + entries.map(en => G.players[Number(en[0])].name + ' x' + en[1]).join(', ') + '.', 'sys');
  if (leaders.length > 1) {
    log('THE TOWN COULD NOT DECIDE - NO ONE WAS VOTED OUT.', 'good');
    showBanner('NO CONSENSUS', '#8fe8dc');
  } else {
    eliminate(G.players[leaders[0]], 'voted out by the town');
  }
  if (!G.gameOver) addTimer(startNight, 900);
}
/* elimination with flip-out / flip-in, stamp, drawn X and board shake */
function eliminate(p, how) {
  if (!p || !p.alive) return;
  const grid = $('card-grid');
  const old = grid.querySelector('.card[data-id="' + p.id + '"]');
  if (old) old.classList.add('flipout');
  addTimer(function() {
    p.alive = false;
    G.animDead = p.id;
    log(p.name.toUpperCase() + ' WAS ' + how.toUpperCase() + ' - THEY WERE THE ' + p.role + '.',
        p.role === 'MAFIA' ? 'good' : 'bad');
    if (p.id === G.meId) {
      toast('YOU WERE ELIMINATED - SPECTATOR MODE', '#ff0055');
      log('YOU ARE DEAD. WATCH THE CYCLE UNFOLD.', 'me');
      ticker('SPECTATOR MODE');
    } else {
      showBanner(p.name + ' WAS THE ' + p.role, p.role === 'MAFIA' ? '#33ff88' : '#ff6688');
    }
    renderHUD(); renderCards(false); renderSlot(); renderLog();
    grid.classList.add('shake');
    addTimer(() => grid.classList.remove('shake'), 500);
    G.animDead = null;
    saveGame();
    checkWin();
    if (!G.gameOver && how === 'voted out by the town') { /* startNight scheduled by tallyVotes */ }
  }, old ? 170 : 0);
}
function startNight() {
  if (G.gameOver) return;
  G.phase = 'NIGHT';
  G.night = { kill: null, protect: null, investigated: null, save: false };
  G.await = null;
  showNight(G.turn);
  log('--- NIGHT ' + G.turn + ' ---', 'hdr');
  const you = me();
  if (you.alive) {
    if (you.role === 'MAFIA') {
      G.await = 'kill';
      ticker('NIGHT - DRAG A CARD TO THE KILL SLOT');
      log('THE CREW LOOKS TO YOU FOR A TARGET.', 'me');
    } else if (you.role === 'DOCTOR') {
      G.await = 'protect';
      ticker('NIGHT - DRAG A CARD TO THE PROTECT SLOT');
      log('WHO WILL YOU KEEP BREATHING TONIGHT?', 'me');
    } else if (you.role === 'DETECTIVE') {
      G.await = 'investigate';
      ticker('NIGHT - DRAG A CARD TO THE SCAN SLOT');
      log('CHOOSE A SUSPECT TO SCAN.', 'me');
    } else {
      G.await = null;
      ticker('NIGHT - THE TOWN SLEEPS...');
      addTimer(resolveNight, 3000);
    }
  } else {
    G.await = null;
    ticker('NIGHT - THE MAFIA PROWL...');
    addTimer(resolveNight, 3000);
  }
  renderAll();
  saveGame();
}
function resolveNight() {
  if (G.gameOver || G.phase !== 'NIGHT') return;
  const targets = alivePlayers();
  let killId = G.night.kill;
  if (killId === null) {
    const shooters = aliveMafia().filter(p => p.id !== G.meId);
    const victims = targets.filter(p => p.role !== 'MAFIA');
    if (shooters.length && victims.length) killId = pick(victims).id;
  }
  let protectId = G.night.protect;
  if (protectId === null) {
    const docs = alivePlayers().filter(p => p.role === 'DOCTOR' && p.id !== G.meId);
    if (docs.length && targets.length) protectId = pick(targets).id;
  }
  const detId = G.night.investigated;
  if (detId !== null) {
    const t = G.players[detId];
    const res = t.role === 'MAFIA' ? 'GUILTY - MAFIA' : 'INNOCENT - NOT MAFIA';
    log('SCAN COMPLETE: ' + t.name + ' IS ' + res + '.', t.role === 'MAFIA' ? 'good' : 'me');
    toast('SCAN: ' + t.name + ' IS ' + res, t.role === 'MAFIA' ? '#33ff88' : '#ffcc00');
  } else {
    const dets = alivePlayers().filter(p => p.role === 'DETECTIVE' && p.id !== G.meId);
    const pool = targets.filter(p => p.role !== 'DETECTIVE');
    if (dets.length && pool.length) {
      const t = pick(pool);
      if (t.role === 'MAFIA') dets[0].knownMafia = t.id;
    }
  }
  G.turn++;
  G.animDead = null;
  if (killId !== null) {
    const victim = G.players[killId];
    if (protectId === killId) {
      log('GUNFIRE IN THE DARK - BUT THE DOCTOR WAS THERE. NO ONE DIED.', 'good');
      toast('THE DOCTOR SAVED A LIFE', '#33ff88');
      showBanner('THE DOCTOR SAVED A LIFE', '#33ff88');
    } else {
      const grid = $('card-grid');
      const old = grid.querySelector('.card[data-id="' + victim.id + '"]');
      if (old) old.classList.add('flipout');
      addTimer(function() {
        victim.alive = false;
        G.animDead = victim.id;
        log('AT DAWN, ' + victim.name + ' WAS FOUND DEAD - THEY WERE THE ' + victim.role + '.',
            victim.role === 'MAFIA' ? 'good' : 'bad');
        if (victim.id === G.meId) {
          toast('YOU WERE KILLED IN THE NIGHT', '#ff0055');
          log('YOU ARE DEAD. WATCH THE CYCLE UNFOLD.', 'me');
        }
        showBanner(victim.name + ' WAS MURDERED', '#ff6688');
        renderHUD(); renderCards(false); renderSlot(); renderLog();
        grid.classList.add('shake');
        addTimer(() => grid.classList.remove('shake'), 500);
        G.animDead = null;
        saveGame();
        if (!checkWin()) addTimer(startDay, 1200);
      }, old ? 170 : 0);
      saveGame();
      return;
    }
  } else {
    log('A QUIET NIGHT - NO BODIES AT DAWN.', 'sys');
    showBanner('A QUIET NIGHT', '#8fe8dc');
  }
  G.await = null;
  renderAll();
  saveGame();
  if (!checkWin()) addTimer(startDay, 1400);
}
function checkWin() {
  const m = aliveMafia().length, t = aliveTown().length;
  if (m === 0) { showWinner('TOWN', 'Every mafia has been eliminated. Justice under the neon sun.'); return true; }
  if (m >= t) { showWinner('MAFIA', 'The mafia now equal the town. The streets belong to them.'); return true; }
  return false;
}
function showWinner(winner, reason) {
  G.gameOver = true;
  G.winner = winner;
  G.allRevealed = true;
  G.await = null;
  clearTimers();
  setDisp($('night-overlay'), false);
  renderCards(false); renderHUD(); renderSlot();
  const wt = $('winner-text');
  wt.textContent = winner === 'TOWN' ? 'TOWN WINS' : 'MAFIA WINS';
  wt.setAttribute('fill', winner === 'TOWN' ? '#00e5ff' : '#ff0055');
  wt.classList.add('glitch');
  $('winner-sub').textContent = reason;
  const gb = $('go-btns');
  clear(gb);
  mkBtn(gb, 0, 0, 190, 44, 'PLAY AGAIN', newGame, { fs: 14 });
  mkBtn(gb, 210, 0, 190, 44, 'MAIN MENU', () => { openSetup(); }, { fs: 14 });
  setDisp($('game-over'), true);
  ticker('GAME OVER - ' + winner + ' WINS');
  showBanner(winner + ' WINS', winner === 'TOWN' ? '#00e5ff' : '#ff0055');
  log('=== ' + winner + ' WINS ===', winner === 'TOWN' ? 'good' : 'bad');
  saveGame();
}

/* ============================================================
   SAVE / LOAD
   ============================================================ */
function serialize() {
  return {
    v: 3,
    cfg: G.cfg,
    players: G.players.map(p => ({ id: p.id, name: p.name, role: p.role, faction: p.faction, alive: p.alive, seed: p.seed, faceSrc: p.faceSrc, knownMafia: p.knownMafia })),
    meId: G.meId, turn: G.turn, phase: G.phase, await: G.await,
    votes: G.votes, votedThisDay: G.votedThisDay, night: G.night,
    gameOver: G.gameOver, winner: G.winner, allRevealed: G.allRevealed,
    log: G.log.slice(-90), statusMsg: G.statusMsg
  };
}
function saveGame() {
  if (G.screen !== 'game' || !G.players.length) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) { /* quota */ }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function applySave(obj) {
  if (!obj || obj.v !== 3 || !Array.isArray(obj.players) || !obj.players.length) throw new Error('bad save');
  clearTimers();
  G.cfg = obj.cfg || { size: obj.players.length };
  G.players = obj.players;
  G.meId = obj.meId; G.turn = obj.turn; G.phase = obj.phase;
  G.await = obj.await; G.votes = obj.votes || {}; G.votedThisDay = !!obj.votedThisDay;
  G.night = obj.night || { kill: null, protect: null, investigated: null, save: false };
  G.gameOver = !!obj.gameOver; G.winner = obj.winner || null; G.allRevealed = !!obj.allRevealed;
  G.log = Array.isArray(obj.log) ? obj.log : [];
  showScreen('game');
  setDisp($('night-overlay'), G.phase === 'NIGHT' && !G.gameOver);
  if (G.phase === 'NIGHT' && !G.gameOver) showNight(G.turn);
  setDisp($('game-over'), false);
  renderHUDButtons();
  renderAll();
  ticker(obj.statusMsg || 'GAME RESTORED');
  toast('GAME RESTORED', '#ffcc00');
  if (G.gameOver && G.winner) {
    showWinner(G.winner, G.winner === 'TOWN' ? 'Every mafia has been eliminated. (restored)' : 'The mafia now equal the town. (restored)');
  } else if (!G.await) {
    if (G.phase === 'DAY') addTimer(aiDayResolve, 2200);
    else addTimer(resolveNight, 2600);
  }
  saveGame();
}
function resumeGame() {
  try { applySave(JSON.parse(localStorage.getItem(SAVE_KEY))); }
  catch (e) { toast('SAVE UNREADABLE - STARTING NEW', '#ff0055'); openSetup(); }
}
function exportSave() {
  if (!G.players.length) { toast('NO GAME TO EXPORT', '#ff0055'); return; }
  const blob = new Blob([JSON.stringify(serialize(), null, 2)], { type: 'application/json' });
  const a = document.createElementNS(XHTML, 'a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mafia_arena_save.json';
  document.body.appendChild(a); a.click(); a.remove();
  toast('SAVE EXPORTED AS .JSON', '#ffcc00');
}
function importSave(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    try { applySave(JSON.parse(ev.target.result)); }
    catch (e) { toast('INVALID SAVE FILE', '#ff0055'); }
  };
  reader.readAsText(file);
}

/* ============================================================
   HUD BUTTONS + INIT
   ============================================================ */
function renderHUDButtons() {
  const hb = $('hud-btns');
  clear(hb);
  mkBtn(hb, 0, 0, 92, 30, 'SAVE', () => { saveGame(); toast('GAME SAVED', '#33ff88'); });
  mkBtn(hb, 100, 0, 92, 30, 'EXPORT', exportSave);
  mkBtn(hb, 200, 0, 92, 30, 'IMPORT', () => $('file-save').click());
  mkBtn(hb, 300, 0, 92, 30, 'MENU', () => { saveGame(); clearTimers(); openSetup(); });
}
$('file-save').addEventListener('change', (e) => {
  const f = (e.target.files || [])[0];
  if (f) importSave(f);
  e.target.value = '';
});

runBoot();

/* console debug hook (handy for testing / power users) */
window.GEN = { G, newGame, applySave, serialize, checkWin, showWinner, resolveNight, startNight, startDay, aiDayResolve, eliminate, fetchRepoSvgs, fetchRawUrls, svgTextToFace };
})();
